<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root{
    --space-950:#040817;
    --space-900:#070D22;
    --space-800:#0B1533;
    --space-700:#122048;
    --nebula:#1B2E66;
    --star-blue:#3E7BFF;
    --star-light:#7FA8FF;
    --ice:#C9D9FF;
    --white:#F4F7FF;
    --muted:#8B9BC7;
    --alert:#FF5C6B;
    --alert-soft:rgba(255,92,107,.12);
    --ok:#3EE08E;
    --warn:#FFB020;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Montserrat',system-ui,sans-serif;
    background:var(--space-950);
    color:var(--white);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 80px}

  /* Menú hamburguesa */
  .burger-btn{
    position:fixed;top:18px;right:18px;z-index:60;
    width:44px;height:44px;border-radius:12px;border:1px solid rgba(127,168,255,.3);
    background:var(--space-800);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;cursor:pointer;
  }
  .burger-btn span{width:20px;height:2px;background:var(--ice);border-radius:2px}
  .menu-overlay{
    position:fixed;inset:0;background:rgba(4,8,23,.6);z-index:70;
  }
  .menu-panel{
    position:fixed;top:0;right:0;height:100%;width:min(78vw,300px);z-index:80;
    background:var(--space-800);border-left:1px solid rgba(127,168,255,.2);
    padding:20px 18px;display:flex;flex-direction:column;gap:6px;
    box-shadow:-12px 0 40px rgba(0,0,0,.4);
  }
  .menu-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .menu-title{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--star-light)}
  .menu-close{background:none;border:none;color:var(--ice);font-size:18px;cursor:pointer;padding:4px}
  .menu-panel a{
    display:block;padding:12px 10px;border-radius:10px;color:var(--white);
    text-decoration:none;font-size:14.5px;font-weight:600;
  }
  .menu-panel a:hover{background:rgba(127,168,255,.1)}
  .menu-link-highlight{color:#22B27A !important;font-weight:800}

  /* Header */
  header{
    position:relative;
    padding:38px 30px 34px;
    border-radius:22px;
    background:
      radial-gradient(120% 140% at 50% -20%, var(--nebula) 0%, rgba(27,46,102,0) 55%),
      linear-gradient(180deg, var(--space-800) 0%, var(--space-900) 100%);
    border:1px solid rgba(127,168,255,.14);
    overflow:hidden;
  }
  .eyebrow{
    font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--star-light);
  }
  h1{
    font-size:clamp(28px,4vw,42px);font-weight:800;line-height:1.08;
    margin:12px 0 10px;letter-spacing:-.01em;
  }
  h1 span{color:var(--star-blue);text-shadow:0 0 26px rgba(62,123,255,.55)}
  .sub{color:var(--ice);max-width:640px;font-weight:400;font-size:15px;line-height:1.55}
  .meta{
    display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:rgba(18,32,72,.7);border:1px solid rgba(127,168,255,.16);color:var(--ice);
  }
  .chip .dot{width:7px;height:7px;border-radius:999px;background:var(--star-blue)}
  .chip.urgente .dot{background:var(--alert)}

  /* Última actualización en grande */
  .lastupdate{
    display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;
    margin-bottom:20px;padding:26px 22px;border-radius:22px;
    background:linear-gradient(180deg, rgba(62,123,255,.20), rgba(62,123,255,.05));
    border:1px solid rgba(127,168,255,.4);
    box-shadow:0 10px 34px rgba(62,123,255,.16);
  }
  .lastupdate .lu-label{
    display:inline-flex;align-items:center;gap:9px;
    font-size:12.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--star-light);
  }
  .lastupdate .lu-label .live{
    width:9px;height:9px;border-radius:999px;background:var(--ok);
    box-shadow:0 0 0 0 rgba(62,224,142,.6);animation:pulse 2s infinite;
  }
  .lastupdate .lu-time{font-size:clamp(26px,6vw,44px);font-weight:900;color:var(--white);line-height:1.02;letter-spacing:-.01em}

  /* Bloques informativos */
  .grid-info{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:20px}
  .card{
    background:var(--space-800);
    border:1px solid rgba(127,168,255,.14);
    border-radius:18px;padding:22px 24px;
  }
  .card h2{
    font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--star-light);margin-bottom:14px;
  }
  .needs{display:flex;flex-wrap:wrap;gap:8px}
  .need{
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;
    background:var(--space-700);border:1px solid rgba(127,168,255,.12);color:var(--white);
  }
  .alert-card{
    background:var(--alert-soft);
    border:1px solid rgba(255,92,107,.4);
    display:flex;flex-direction:column;justify-content:center;
  }
  .alert-card .tag{
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--alert);margin-bottom:8px;
  }
  .alert-card p{font-size:16px;font-weight:700;line-height:1.35;color:var(--white)}

  /* Banner sectores sobreabastecidos */
  .overstock{
    margin-top:20px;padding:22px 24px;border-radius:20px;
    background:rgba(255,176,32,.10);border:1px solid rgba(255,176,32,.42);
  }
  .overstock .tag{
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--warn);margin-bottom:14px;display:flex;align-items:center;gap:9px;line-height:1.3;
  }
  .overstock .tag svg{flex:none}
  .overstock .needs{margin-bottom:12px}
  .overstock .need{
    background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.35);color:#FFE1A8;font-weight:600;
  }
  .overstock .desc{font-size:13.5px;line-height:1.55;color:var(--ice)}

  /* Sección de contraste: no salir sin verificar */
  .contrast{
    margin-bottom:20px;padding:26px 26px;border-radius:22px;text-align:center;
    background:linear-gradient(180deg, rgba(62,224,142,.14), rgba(62,224,142,.04));
    border:1px solid rgba(62,224,142,.45);
  }
  .contrast h2{
    font-size:clamp(18px,3vw,24px);font-weight:900;line-height:1.15;color:var(--white);
    margin-bottom:12px;letter-spacing:-.01em;
  }
  .contrast h2 span{color:var(--ok)}
  .contrast p{font-size:14.5px;line-height:1.6;color:var(--ice);max-width:640px;margin:0 auto 10px}
  .contrast p:last-child{margin-bottom:0}
  .contrast p strong{color:var(--white);font-weight:800}
  .contrast .contrast-cierre{margin-top:12px;font-size:15px;font-weight:800;color:var(--ok)}

  /* Marco de alta prioridad */
  .priority{
    margin-top:20px;padding:22px 24px;border-radius:20px;
    background:linear-gradient(180deg, rgba(255,92,107,.16), rgba(255,92,107,.07));
    border:1px solid rgba(255,92,107,.55);
    box-shadow:0 0 0 1px rgba(255,92,107,.15), 0 10px 30px rgba(255,92,107,.12);
  }
  .priority .tag{
    font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--alert);margin-bottom:14px;display:flex;align-items:center;gap:9px;
  }
  .priority .tag svg{flex:none}
  .priority .pr-item{
    display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,92,107,.16);
  }
  .priority .pr-item:last-child{border-bottom:none;padding-bottom:0}
  .priority .pr-item:first-of-type{padding-top:0}
  .priority .pr-dot{flex:none;width:9px;height:9px;border-radius:999px;background:var(--alert);margin-top:6px}
  .priority .pr-name{font-size:15.5px;font-weight:800;color:var(--white);margin-bottom:2px}
  .priority .pr-fecha{font-size:11.5px;font-weight:700;color:var(--star-light);letter-spacing:.01em;margin-bottom:4px}
  .priority .pr-nota{font-size:13.5px;line-height:1.5;color:var(--ice)}
  .pr-vermas{
    margin-top:6px;width:100%;cursor:pointer;font-family:inherit;font-size:13px;font-weight:800;
    color:var(--star-light);background:rgba(127,168,255,.08);border:1px solid rgba(127,168,255,.25);
    padding:10px 14px;border-radius:12px;transition:background .15s,border-color .15s;
  }
  .pr-vermas:hover{background:rgba(127,168,255,.16);border-color:rgba(127,168,255,.45)}

  /* Albergues temporales */
  .albergues{
    margin-top:20px;padding:24px 26px;border-radius:20px;
    background:var(--space-800);border:1px solid rgba(62,224,142,.32);
  }
  .albergues h2{
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ok);margin:0;
  }
  .al-toggle{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    background:none;border:none;padding:0;margin-bottom:6px;cursor:pointer;
  }
  .al-chevron{
    color:var(--ok);font-size:16px;transition:transform .15s;flex:0 0 auto;margin-left:12px;
  }
  .al-chevron.open{transform:rotate(180deg)}
  .albergues .al-sub{color:var(--ice);font-size:13.5px;line-height:1.5;margin-bottom:16px}
  .al-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .al-item{
    background:var(--space-900);border:1px solid rgba(62,224,142,.2);
    border-radius:14px;padding:14px 16px;
  }
  .al-nombre{font-size:14.5px;font-weight:700;color:var(--white)}
  .al-cupos{
    display:inline-block;margin-left:8px;font-size:11px;font-weight:800;
    letter-spacing:.04em;color:#04240F;background:var(--ok);
    padding:2px 8px;border-radius:999px;vertical-align:middle;
  }
  .al-dir{color:var(--star-light);font-size:12.5px;font-weight:500;margin-top:5px;line-height:1.4}
  .al-contacto{
    margin-top:16px;padding:14px 16px;border-radius:12px;
    background:rgba(62,224,142,.1);border:1px solid rgba(62,224,142,.28);
    color:var(--white);font-size:13.5px;font-weight:600;line-height:1.5;
  }
  .al-nota{margin-top:10px;color:var(--ice);font-size:13px;line-height:1.5}
  .psico-grupo{margin-top:18px;padding-top:16px;border-top:1px solid rgba(127,168,255,.14)}
  .psico-grupo:first-of-type{margin-top:4px;padding-top:0;border-top:none}
  .psico-grupo-tit{font-size:15px;font-weight:800;color:var(--white);margin-bottom:5px}
  .psico-grupo-info{color:var(--ice);font-size:13px;line-height:1.5;margin-bottom:10px}

  /* ===== Directorio de ayuda (collapse con color de contraste) ===== */
  .albergues.directorio{
    border:1.5px solid rgba(62,224,142,.5);
    background:linear-gradient(180deg,rgba(62,224,142,.09),rgba(62,224,142,.02));
    box-shadow:0 0 0 1px rgba(62,224,142,.12), 0 10px 30px rgba(0,0,0,.25);
  }
  .albergues.directorio .al-toggle h2{color:#5EEAA0}
  .albergues.directorio .al-chevron{color:#5EEAA0}
  .dir-cat{margin-top:18px;padding-top:14px;border-top:1px solid rgba(62,224,142,.18)}
  .dir-cat:first-of-type{margin-top:6px;padding-top:0;border-top:none}
  .dir-cat-tit{
    display:inline-block;font-size:13px;font-weight:800;letter-spacing:.02em;
    color:#04240F;background:#5EEAA0;padding:4px 11px;border-radius:999px;margin-bottom:10px;
  }
  .dir-cat-nota{color:var(--ice);font-size:12.5px;line-height:1.5;margin:0 0 10px}
  .dir-items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dir-item{
    background:var(--space-900);border:1px solid rgba(127,168,255,.14);
    border-radius:12px;padding:12px 14px;
  }
  .dir-item-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .dir-nombre{font-size:14px;font-weight:800;color:var(--white)}
  .dir-contacto{
    flex:none;font-size:12.5px;font-weight:800;color:#04240F;background:#5EEAA0;
    padding:3px 9px;border-radius:999px;text-decoration:none;white-space:nowrap;
  }
  .dir-contacto:hover{background:#7ef0b4}
  .dir-contacto.texto{background:transparent;color:var(--star-light);padding:0}
  .dir-serv{color:var(--ice);font-size:13px;line-height:1.45}
  .dir-zona{color:var(--star-light);font-size:12px;font-weight:600;margin-top:5px}
  .dir-obs{color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:5px;font-style:italic}
  .dir-filtros{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 14px}
  .dir-filtro{
    cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;
    color:var(--ice);background:var(--space-900);border:1px solid rgba(62,224,142,.28);
    padding:6px 12px;border-radius:999px;transition:background .15s,color .15s,border-color .15s;
  }
  .dir-filtro:hover{border-color:rgba(62,224,142,.55)}
  .dir-filtro.activo{background:#5EEAA0;color:#04240F;border-color:#5EEAA0}
  .dir-cat-chip{
    display:inline-block;margin-bottom:6px;font-size:10.5px;font-weight:700;
    color:#5EEAA0;background:rgba(62,224,142,.12);border:1px solid rgba(62,224,142,.3);
    padding:2px 8px;border-radius:999px;
  }
  .dir-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
  .dir-count{font-size:12px;font-weight:600;color:var(--muted)}
  .dir-vermas{
    cursor:pointer;font-family:inherit;font-size:13px;font-weight:800;
    color:#04240F;background:#5EEAA0;border:none;padding:9px 18px;border-radius:12px;transition:background .15s;
  }
  .dir-vermas:hover{background:#7ef0b4}
  @media (max-width:680px){ .al-list{grid-template-columns:1fr} .dir-items{grid-template-columns:1fr} }

  /* Últimas actualizaciones */
  .updates{
    margin-top:20px;
    background:var(--space-800);
    border:1px solid rgba(127,168,255,.14);
    border-radius:18px;padding:22px 24px;
  }
  .updates h2{
    font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--star-light);margin-bottom:16px;display:flex;align-items:center;gap:9px;
  }
  .updates h2 .live{
    width:8px;height:8px;border-radius:999px;background:var(--ok);
    box-shadow:0 0 0 0 rgba(62,224,142,.6);animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(62,224,142,.5)}
    70%{box-shadow:0 0 0 8px rgba(62,224,142,0)}
    100%{box-shadow:0 0 0 0 rgba(62,224,142,0)}
  }
  .up-item{
    display:flex;gap:14px;padding:12px 0;
    border-bottom:1px solid rgba(127,168,255,.08);
  }
  .up-item:last-child{border-bottom:none;padding-bottom:0}
  .up-item:first-child{padding-top:0}
  .up-dot{
    flex:none;width:9px;height:9px;border-radius:999px;background:var(--star-blue);margin-top:6px;
  }
  .up-body{flex:1}
  .up-time{
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);
    text-transform:uppercase;margin-bottom:3px;
  }
  .up-text{font-size:14px;color:var(--white);line-height:1.5;font-weight:500}
  .up-punto{font-size:14px;font-weight:800;color:var(--star-light);margin-bottom:2px}
  .up-contacto{font-size:12.5px;font-weight:600;color:var(--ok);margin-top:5px}
  .up-toggle{
    margin-top:16px;width:100%;cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:700;color:var(--star-light);
    background:var(--space-900);border:1px solid rgba(127,168,255,.2);
    border-radius:12px;padding:11px 16px;transition:.15s;
  }
  .up-toggle:hover{border-color:var(--star-blue);color:var(--white)}

  /* Ayuda disponible */
  .ayudas{
    margin-top:20px;
    background:var(--space-800);
    border:1px solid rgba(62,224,142,.3);
    border-radius:20px;padding:24px 26px;
  }
  .ayudas h2{
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ok);margin-bottom:6px;
  }
  .ayudas .ay-sub{color:var(--ice);font-size:13.5px;margin-bottom:16px}
  .ay-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ay-item{
    background:var(--space-900);border:1px solid rgba(62,224,142,.2);
    border-radius:14px;padding:14px 16px;
  }
  .ay-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ay-rec{font-size:14.5px;font-weight:700;color:var(--white)}
  .ay-dest{
    font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ok);background:rgba(62,224,142,.12);padding:3px 9px;border-radius:999px;flex:none;
  }
  .ay-coord{color:var(--star-light);font-size:12.5px;font-weight:600;margin-top:7px}
  .ay-obs{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.45}
  @media (max-width:680px){
    .ay-list{grid-template-columns:1fr}
  }

  /* Botón que lleva al formulario */
  .cta-reportar{
    display:flex;align-items:center;justify-content:center;gap:11px;
    margin-top:20px;text-decoration:none;cursor:pointer;
    font-size:15.5px;font-weight:700;color:#fff;
    padding:16px 24px;border-radius:16px;
    background:linear-gradient(180deg,var(--star-blue),#2E5FE0);
    border:1px solid rgba(127,168,255,.4);
    box-shadow:0 8px 22px rgba(62,123,255,.28);transition:.15s;
  }
  .cta-reportar:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(62,123,255,.42)}
  .cta-reportar .cta-ico{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:999px;background:rgba(255,255,255,.2);
    font-size:18px;font-weight:400;line-height:1;
  }
  #reportar{scroll-margin-top:20px}
  #refugio{scroll-margin-top:20px}
  .top-actions{
    display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px;
  }
  .cta-sm{
    flex:1 1 220px;margin-top:0;padding:11px 16px;font-size:13px;border-radius:12px;
  }
  .cta-sm .cta-ico{width:19px;height:19px;font-size:14px}
  .cta-refugio{
    background:linear-gradient(180deg,#22B27A,#178A5D);
    border:1px solid rgba(120,230,190,.4);
    box-shadow:0 8px 22px rgba(34,178,122,.28);
  }
  .cta-refugio:hover{box-shadow:0 10px 28px rgba(34,178,122,.42)}
  .map-btn{background:linear-gradient(180deg,#2E5FE0,#1E3FB0)}
  .mapa-box{
    margin-top:16px;border:1px solid rgba(127,168,255,.18);
    border-radius:20px;overflow:hidden;background:var(--space-800);
  }
  .mapa{height:460px;width:100%}
  .mapa .leaflet-popup-content{font-family:'Montserrat',sans-serif;font-size:13px;line-height:1.4}
  .mapa .leaflet-tooltip.mapa-label{
    background:rgba(7,13,34,.9);border:1px solid rgba(127,168,255,.4);color:var(--white);
    font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;padding:2px 7px;border-radius:7px;
    box-shadow:0 4px 12px rgba(0,0,0,.4);white-space:nowrap;
  }
  .mapa .leaflet-tooltip.mapa-label.urg{border-color:var(--alert);color:#FFD7DC}
  .mapa .leaflet-tooltip.mapa-label::before{display:none}
  .mapa-nota{padding:12px 18px;font-size:12px;color:var(--muted);line-height:1.5}

  /* Clínicas que requieren evacuación */
  .clinicas{
    margin-top:20px;
    background:var(--alert-soft);
    border:1px solid rgba(255,92,107,.4);
    border-radius:20px;padding:24px 26px;
  }
  .clinicas h2{
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--alert);margin-bottom:6px;display:flex;align-items:center;gap:9px;
  }
  .clinicas .cl-sub{color:var(--ice);font-size:13.5px;margin-bottom:16px}
  .cl-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cl-item{
    display:flex;align-items:center;gap:10px;
    background:var(--space-900);border:1px solid rgba(255,92,107,.25);
    border-radius:12px;padding:12px 15px;font-size:14.5px;font-weight:600;color:var(--white);
  }
  .cl-item::before{
    content:"";flex:none;width:8px;height:8px;border-radius:999px;background:var(--alert);
  }
  @media (max-width:680px){
    .cl-list{grid-template-columns:1fr}
  }

  /* Formulario de actualización */
  .form-card{
    margin-top:20px;
    background:
      radial-gradient(120% 160% at 100% 0%, rgba(62,123,255,.14) 0%, rgba(62,123,255,0) 55%),
      var(--space-800);
    border:1px solid rgba(127,168,255,.22);
    border-radius:20px;padding:26px 26px 28px;
  }
  .form-card .eyebrow{margin-bottom:6px}
  .form-card h2{
    font-size:clamp(20px,2.6vw,26px);font-weight:800;line-height:1.12;
    color:var(--white);margin:0 0 6px;letter-spacing:-.01em;text-transform:none;
  }
  .form-card .form-sub{color:var(--ice);font-size:14px;line-height:1.5;margin-bottom:20px;max-width:560px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1 / -1}
  .field label{
    font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--star-light);
  }
  .field input,.field textarea{
    width:100%;font-family:inherit;font-size:15px;color:var(--white);
    background:var(--space-900);border:1px solid rgba(127,168,255,.18);
    border-radius:12px;padding:12px 14px;outline:none;transition:.15s;
  }
  .field textarea{min-height:96px;resize:vertical;line-height:1.5}
  .field input::placeholder,.field textarea::placeholder{color:var(--muted)}
  .field input:focus,.field textarea:focus{
    border-color:var(--star-blue);box-shadow:0 0 0 3px rgba(62,123,255,.18);
  }
  .btn-enviar{
    grid-column:1 / -1;justify-self:start;margin-top:4px;
    display:inline-flex;align-items:center;gap:9px;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:700;color:#fff;
    padding:13px 26px;border:none;border-radius:999px;
    background:linear-gradient(180deg,var(--star-blue),#2E5FE0);
    box-shadow:0 8px 22px rgba(62,123,255,.28);transition:.15s;
  }
  .btn-enviar:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(62,123,255,.4)}
  .hp{position:absolute;left:-9999px}
  @media (max-width:680px){
    .form-grid{grid-template-columns:1fr}
  }

  /* Controles */
  .controls{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    margin:32px 0 16px;
  }
  .search{
    flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
    background:var(--space-800);border:1px solid rgba(127,168,255,.16);
    border-radius:999px;padding:12px 18px;
  }
  .search:focus-within{border-color:var(--star-blue);box-shadow:0 0 0 3px rgba(62,123,255,.18)}
  .search svg{flex:none;opacity:.7}
  .search input{
    flex:1;background:none;border:none;outline:none;color:var(--white);
    font-family:inherit;font-size:15px;
  }
  .search input::placeholder{color:var(--muted)}
  .toggle{
    display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
    padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;
    background:var(--space-800);border:1px solid rgba(127,168,255,.16);color:var(--ice);
    transition:.15s;
  }
  .toggle.on{
    background:linear-gradient(180deg,var(--star-blue),#2E5FE0);
    border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(62,123,255,.28);
  }
  .toggle .box{width:16px;height:16px;border-radius:5px;border:2px solid currentColor;position:relative}
  .toggle.on .box::after{content:"";position:absolute;inset:2px;border-radius:2px;background:#fff}

  .counter{font-size:13px;color:var(--muted);margin-left:auto;font-weight:500}

  /* Tabla */
  .tabla{
    width:100%;border-collapse:separate;border-spacing:0;
    background:var(--space-900);border:1px solid rgba(127,168,255,.12);
    border-radius:18px;overflow:hidden;
  }
  .tabla thead th{
    text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--star-light);padding:16px 20px;background:var(--space-800);
    border-bottom:1px solid rgba(127,168,255,.14);
  }
  .tabla tbody td{
    padding:16px 20px;border-bottom:1px solid rgba(127,168,255,.07);
    vertical-align:top;font-size:14.5px;
  }
  .tabla tbody tr:last-child td{border-bottom:none}
  .tabla tbody tr.prio{background:linear-gradient(90deg,rgba(62,123,255,.09),transparent 60%)}
  .lugar{font-weight:700;color:var(--white);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .badge{
    font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;flex:none;
    background:var(--alert);color:#fff;
  }
  .badge.ok{background:var(--ok);color:#04240F}
  .nota-ok{
    display:inline-flex;align-items:center;gap:7px;
    font-size:13px;font-weight:600;color:var(--ok);
  }
  .nota-ok::before{content:"";width:7px;height:7px;border-radius:999px;background:var(--ok);flex:none}
  .nota-info{
    display:inline-flex;align-items:center;gap:7px;
    font-size:13px;font-weight:600;color:var(--star-light);
  }
  .nota-info::before{content:"";width:7px;height:7px;border-radius:999px;background:var(--star-blue);flex:none}
  .nota-alert{
    display:inline-flex;align-items:flex-start;gap:7px;
    font-size:13px;font-weight:700;color:var(--alert);line-height:1.4;
  }
  .nota-alert::before{content:"";width:7px;height:7px;border-radius:999px;background:var(--alert);flex:none;margin-top:5px}
  .dir{color:var(--ice);font-weight:500}
  .dir.vacio{color:var(--muted);font-style:italic;font-weight:400}
  .p-dir{color:var(--ice);font-size:13px;font-weight:500;margin-top:3px}
  .p-coord{color:var(--star-light);font-size:12.5px;font-weight:600;margin-top:5px}
  .p-hora{color:var(--muted);font-size:11.5px;font-weight:500;margin-top:5px}
  .cel-nota{color:var(--ice);font-size:13.5px;font-weight:500;line-height:1.45;margin-bottom:8px}
  .badge.activo{background:rgba(127,168,255,.16);color:var(--star-light)}
  .cel-need{display:flex;flex-wrap:wrap;gap:6px}
  .cel-need .need{font-size:12px;padding:5px 10px}
  .sinnead{color:var(--muted);font-size:13px}
  .empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:15px}

  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
  .footer-credit{margin-top:6px;font-size:11.5px;color:var(--muted)}
  .footer-credit a{color:var(--star-light);text-decoration:none;font-weight:600}
  .footer-credit a:hover{text-decoration:underline}
  footer strong{color:var(--ice);font-weight:600}

  @media (max-width:820px){
    .grid-info{grid-template-columns:1fr}
  }
  @media (max-width:680px){
    .wrap{padding:24px 14px 60px}
    header{padding:28px 20px}
    .counter{width:100%;margin:0;order:5}
    .tabla thead{display:none}
    .tabla,.tabla tbody,.tabla tr,.tabla td{display:block;width:100%}
    .tabla{border-radius:16px}
    .tabla tbody tr{
      border-bottom:1px solid rgba(127,168,255,.12);padding:6px 0;
    }
    .tabla tbody tr:last-child{border-bottom:none}
    .tabla tbody td{border:none;padding:6px 18px}
    .tabla tbody td::before{
      content:attr(data-label);display:block;
      font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
      color:var(--star-light);margin-bottom:4px;
    }
    .tabla tbody td[data-label="Punto"]{padding-top:16px}
  }

  /* ===== Cifras oficiales ===== */
  .cifras{
    margin-top:20px;background:var(--space-800);
    border:1px solid rgba(127,168,255,.16);border-radius:20px;padding:22px 24px;
  }
  .cifras-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .cifras-head h2{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--star-light)}
  .cifras-fuente{font-size:11.5px;color:var(--muted);font-weight:600}
  .cifras-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .cifra{
    background:var(--space-900);border:1px solid rgba(127,168,255,.12);
    border-radius:14px;padding:16px 14px;display:flex;flex-direction:column;gap:4px;
  }
  .cifra-n{font-size:30px;font-weight:800;line-height:1;color:var(--white);letter-spacing:-.02em}
  .cifra-label{font-size:12px;font-weight:600;color:var(--muted);line-height:1.3}
  .cifra.alert{border-color:rgba(255,92,107,.35)}
  .cifra.alert .cifra-n{color:var(--alert)}
  .cifra.ok{border-color:rgba(62,224,142,.35)}
  .cifra.ok .cifra-n{color:var(--ok)}
  .cifras-nota{margin-top:14px;font-size:12.5px;line-height:1.55;color:var(--ice)}
  .cifras-toggle{
    margin-top:14px;width:100%;cursor:pointer;
    background:var(--space-800);border:1px solid rgba(127,168,255,.22);
    color:var(--star-light);font-family:inherit;font-size:13px;font-weight:700;
    padding:11px 14px;border-radius:12px;transition:background .15s,border-color .15s;
  }
  .cifras-toggle:hover{background:var(--space-700);border-color:rgba(127,168,255,.4)}
  @media (max-width:760px){ .cifras-grid{grid-template-columns:repeat(2,1fr)} }

  /* ===== Alerta máxima: niñez ===== */
  .alerta-trata{
    margin-bottom:18px;border-radius:16px;padding:18px 20px;
    background:#C0182A;border:2px solid #FF5C6B;
    box-shadow:0 8px 26px rgba(192,24,42,.45);
  }
  .at-titulo{
    font-size:16px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;
    color:#fff;margin-bottom:8px;
  }
  .alerta-trata p{color:#FFE3E6;font-size:14px;line-height:1.55;font-weight:500}
  .alerta-trata p strong{color:#fff;font-weight:800}
  .alerta-trata.aclaracion{background:#0B3D2E;border-color:var(--ok);box-shadow:0 8px 26px rgba(62,224,142,.28)}
  .alerta-trata.aclaracion .at-titulo{color:#A8F5CE}
  .alerta-trata.aclaracion p{color:#D7FBEA}
  .alerta-trata.aclaracion p strong{color:#fff}

  /* ===== Alerta de fase / coordinación ===== */
  .card-sub{color:var(--ice);font-size:13px;line-height:1.45;margin:-4px 0 12px}
  .alerta-fase{
    margin-top:20px;background:var(--alert-soft);
    border:1px solid rgba(255,92,107,.42);border-radius:20px;padding:22px 24px;
  }
  .af-tag{
    display:flex;align-items:center;gap:9px;
    font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--alert);margin-bottom:12px;
  }
  .af-tag svg{flex:none}
  .alerta-fase p{color:var(--white);font-size:14.5px;line-height:1.55;margin-bottom:10px}
  .alerta-fase p strong{color:var(--alert)}
  .af-cierre{color:var(--ice) !important;font-weight:600;margin-bottom:0 !important}

  /* ===== ¿Buscas a alguien? ===== */
  .busqueda{
    margin-top:20px;background:var(--alert-soft);
    border:1px solid rgba(255,92,107,.4);border-radius:20px;padding:22px 24px;
  }
  .busqueda h2{font-size:16px;font-weight:800;color:var(--alert);margin-bottom:6px}
  .bq-sub{color:var(--ice);font-size:13.5px;line-height:1.5;margin-bottom:14px}
  .bq-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .bq-item{
    display:flex;flex-direction:column;gap:3px;text-decoration:none;
    background:var(--space-900);border:1px solid rgba(255,92,107,.25);
    border-radius:12px;padding:13px 15px;transition:.15s;
  }
  .bq-item:hover{border-color:var(--alert);transform:translateY(-1px)}
  .bq-label{font-size:11.5px;font-weight:600;color:var(--muted)}
  .bq-valor{font-size:15px;font-weight:700;color:var(--white)}
  @media (max-width:680px){ .bq-list{grid-template-columns:1fr} }

  /* ===== Muro de apoyo ===== */
  .muro{
    margin-top:20px;border-radius:20px;padding:24px;
    border:1px solid rgba(127,168,255,.28);
    background:linear-gradient(180deg,rgba(62,123,255,.12),rgba(11,21,51,.4));
  }
  .muro-head h2{font-size:clamp(18px,2.4vw,22px);font-weight:800;color:var(--white);margin:4px 0 8px;letter-spacing:-.01em}
  .muro-sub{color:var(--ice);font-size:13.5px;line-height:1.55;max-width:680px;margin-bottom:16px}
  .muro-form{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  .muro-nombre{flex:0 1 190px;min-width:150px}
  .muro-mensaje{flex:1 1 320px;min-width:200px}
  .muro-form input{
    font-family:inherit;font-size:14px;color:var(--white);
    background:var(--space-900);border:1px solid rgba(127,168,255,.28);
    border-radius:12px;padding:12px 14px;
  }
  .muro-form input::placeholder{color:var(--muted)}
  .muro-form input:focus{outline:none;border-color:var(--star-blue)}
  .muro-btn{
    flex:0 0 auto;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;color:#fff;
    border:none;border-radius:12px;padding:12px 20px;white-space:nowrap;
    background:linear-gradient(180deg,var(--star-blue),#2E5FE0);transition:transform .15s,box-shadow .15s;
  }
  .muro-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(62,123,255,.4)}
  .muro-gracias{margin-top:12px;color:var(--star-light);font-size:13.5px;font-weight:700}
  .muro-grid{
    margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  }
  .muro-card{
    background:var(--space-900);border:1px solid rgba(127,168,255,.16);
    border-radius:14px;padding:15px 16px;display:flex;flex-direction:column;gap:8px;
  }
  .muro-texto{color:var(--ice);font-size:13.5px;line-height:1.5;font-style:italic}
  .muro-firma{color:var(--star-light);font-size:12px;font-weight:700}
  .muro-vacio{margin-top:16px;text-align:center;color:var(--muted);font-size:14px;font-weight:600;
    border:1px dashed rgba(127,168,255,.25);border-radius:14px;padding:20px}
  @media (max-width:820px){ .muro-grid{grid-template-columns:1fr 1fr} }
  @media (max-width:560px){ .muro-grid{grid-template-columns:1fr} .muro-btn{width:100%} }

  /* ===== Promo guía niños ===== */
  .guia-promo{
    display:flex;align-items:center;gap:16px;margin-top:20px;text-decoration:none;
    border-radius:20px;padding:20px 22px;
    border:1px solid rgba(62,123,255,.45);
    background:linear-gradient(120deg,rgba(62,123,255,.16),rgba(27,46,102,.28));
    transition:transform .15s,border-color .15s;
  }
  .guia-promo:hover{transform:translateY(-2px);border-color:rgba(62,123,255,.8)}
  .gp-ico{flex:none;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:rgba(62,123,255,.16);border:1px solid rgba(127,168,255,.35)}
  .gp-body{flex:1}
  .gp-tag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--star-light)}
  .gp-title{font-size:16px;font-weight:800;color:var(--white);margin:3px 0 4px;line-height:1.25}
  .gp-sub{font-size:13px;color:var(--ice);line-height:1.5}
  .gp-cta{flex:none;font-size:13.5px;font-weight:800;color:#fff;background:linear-gradient(180deg,var(--star-blue),#2E5FE0);
    padding:10px 16px;border-radius:12px;white-space:nowrap}
  @media (max-width:640px){ .guia-promo{flex-wrap:wrap} .gp-cta{width:100%;text-align:center} }

  /* ===== Frentes de trabajo (Alcaldía) ===== */
  .frentes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .frente{
    display:flex;gap:13px;align-items:center;
    background:var(--space-800);border:1px solid rgba(127,168,255,.16);
    border-radius:14px;padding:14px 16px;
  }
  .frente-n{
    flex:none;width:28px;height:28px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#fff;
    background:linear-gradient(180deg,var(--star-blue),#2E5FE0);
  }
  .frente-dir{font-size:15px;font-weight:700;color:var(--white)}
  .frente-barrio{font-size:12.5px;font-weight:500;color:var(--star-light);margin-top:2px}
  .frente.alerta{border-color:rgba(245,197,66,.75);background:rgba(245,197,66,.12)}
  .frente.alerta .frente-n{background:linear-gradient(180deg,#F5C542,#D99A1E);color:#3a2a00}
  .frente-alerta-badge{
    display:inline-block;margin-top:6px;padding:3px 9px;border-radius:999px;
    font-size:11px;font-weight:800;letter-spacing:.02em;
    background:#F5C542;color:#3a2a00;
  }
  @media (max-width:680px){ .frentes-grid{grid-template-columns:1fr} }

  /* ===== Fase 4: municipios, laderas, acopios ===== */
  .seccion{margin-top:26px}
  .sec-head{margin-bottom:14px}
  .sec-head h2{
    font-size:clamp(19px,2.6vw,24px);font-weight:800;letter-spacing:-.01em;color:var(--white);margin-bottom:6px;
  }
  .sec-sub{color:var(--ice);font-size:14px;line-height:1.55;max-width:660px}
  .dest-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .dest-item{
    background:var(--space-800);border:1px solid rgba(127,168,255,.16);
    border-radius:16px;padding:18px 20px;
  }
  .dest-item.urg{border-color:rgba(255,92,107,.45);background:var(--alert-soft)}
  .dest-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
  .dest-nombre{font-size:17px;font-weight:800;color:var(--white)}
  .dest-region{font-size:12px;font-weight:600;color:var(--star-light)}
  .dest-nota{color:var(--ice);font-size:13.5px;line-height:1.45;margin:6px 0 10px}
  .dest-dano{color:var(--star-light);font-size:12.5px;line-height:1.5;margin:2px 0 8px;padding-left:10px;border-left:2px solid rgba(255,92,107,.5)}
  .dest-porconf{color:var(--muted);font-size:13px;font-style:italic}
  .dest-contacto{color:var(--star-light);font-size:12.5px;font-weight:600;margin-top:8px}
  .acopio-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .acopio-item{
    background:var(--space-900);border:1px solid rgba(127,168,255,.14);
    border-radius:16px;padding:18px 20px;
  }
  .acopio-nombre{font-size:15.5px;font-weight:700;color:var(--white);margin-bottom:4px}
  .acopio-dir{color:var(--ice);font-size:13px;font-weight:500;margin-bottom:6px}
  .acopio-nota{color:var(--muted);font-size:13px;line-height:1.5}
  .transporte{
    margin-top:16px;background:var(--space-800);

const { useState, useMemo, useRef, useEffect } = React;

function Mapa({ puntos }){
  const ref = useRef(null);
  const mapRef = useRef(null);
  const [estado, setEstado] = useState("Cargando mapa y ubicando puntos…");

  useEffect(() => {
    if (!ref.current || mapRef.current || typeof L === "undefined") return;
    const map = L.map(ref.current).setView([3.95, -76.3], 9);
    mapRef.current = map;
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap"
    }).addTo(map);
    setTimeout(() => map.invalidateSize(), 120);

    let cancel = false;
    (async () => {
      const bounds = [];
      let ok = 0;
      for (const p of puntos) {
        if (cancel) return;
        let lat, lon;
        if (p.coords) { lat = p.coords[0]; lon = p.coords[1]; }
        else {
          const q = p.mapq ? p.mapq : ((p.direccion || p.lugar) + ", Cali, Valle del Cauca, Colombia");
          try {
            const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=co&q=" + encodeURIComponent(q));
            const d = await r.json();
            if (d && d[0]) { lat = parseFloat(d[0].lat); lon = parseFloat(d[0].lon); }
          } catch (e) {}
          await new Promise(res => setTimeout(res, 1100));
        }
        if (cancel) return;
        if (lat != null && lon != null && !isNaN(lat) && !isNaN(lon)) {
          const color = p.estado === "urgente" ? "#FF5C6B" : p.cubierto ? "#3EE08E" : "#3E7BFF";
          const mk = L.circleMarker([lat, lon], {
            radius: 9, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1
          }).addTo(map);
          const needs = (p.necesidades && p.necesidades.length) ? "<br/>" + p.necesidades.join(", ") : "";
          mk.bindPopup("<b>" + p.lugar + "</b>" + (p.direccion ? "<br/>" + p.direccion : "") + needs);
          mk.bindTooltip(p.lugar, { permanent: true, direction: "top", offset: [0, -8], className: "mapa-label" + (p.estado === "urgente" ? " urg" : "") });
          bounds.push([lat, lon]); ok++;
          setEstado(ok + " puntos ubicados…");
        }
      }
      if (!cancel) {
        if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
        setEstado(ok ? (ok + " de " + puntos.length + " puntos ubicados") : "No se pudieron ubicar los puntos automáticamente");
      }
    })();

    return () => { cancel = true; };
  }, []);

  return (
    <div className="mapa-box">
      <div ref={ref} className="mapa"></div>
      <div className="mapa-nota">{estado}. Ubicaciones aproximadas; confirma antes de desplazarte.</div>
    </div>
  );
}

                <div>
                  <div className="frente-dir">{f.dir}</div>
                  <div className="frente-barrio">{f.barrio}</div>
                  {f.alerta ? <span className="frente-alerta-badge">⚠ {f.alertaTexto}</span> : null}
                </div>
              </div>
            ))}
          </div>
        </div>
      ) : null}

      <div className="alerta-fase">
        <div className="af-tag">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF5C6B" strokeWidth="2.2">
            <path d="M12 9v4M12 17h.01"></path>
            <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
          </svg>
          Actualización urgente · Coordinemos la ayuda
        </div>
        <p>Lo ideal es <strong>no saturar las vías del Valle</strong>. Coordinemos las donaciones que se llevan a los municipios para que no todas lleguen al mismo lugar.</p>
        <p>Prioricemos la entrega de <strong>insumos y herramientas en los puntos de acopio oficial</strong>, que están siendo entregados por la Primera Dama y la Presidencia.</p>
        <p className="af-cierre">Coordinar bien la ayuda hace que llegue a más gente. Tu aporte sí hace la diferencia.</p>
      </div>

      {LADERAS.length ? (
        <div className="seccion" id="laderas">
          <div className="sec-head">
            <h2>Laderas de Cali</h2>
            <p className="sec-sub">Zonas de ladera con familias afectadas que están recibiendo apoyo en el sitio.</p>
          </div>
          <div className="dest-list">
            {LADERAS.map((l,i) => (
              <div className="dest-item" key={i}>
                <div className="dest-top">
                  <span className="dest-nombre">{l.nombre}</span>
                  <span className="dest-region">Ladera de Cali</span>
                </div>
                {l.nota ? <div className="dest-nota">{l.nota}</div> : null}
                {l.necesidades.length
                  ? <div className="cel-need">{l.necesidades.map((n,j) => <span className="need" key={j}>{n}</span>)}</div>
                  : null}
              </div>
            ))}
          </div>
        </div>
      ) : null}

      {MEDICAMENTOS_ALBERGUES.length ? (
        <div className="seccion" id="medicamentos">
          <div className="sec-head">
            <h2>Medicamentos para albergues temporales</h2>
            <p className="sec-sub">A medida que las familias pasan más días en los albergues, empiezan a necesitarse estos medicamentos e insumos básicos. Entrégalos siempre con verificación de un profesional de salud; no se deben administrar medicamentos de prescripción sin acompañamiento médico.</p>
          </div>
          <div className="resc-nec">
            <div className="rn-tag">Empiezan a necesitarse</div>
            <div className="needs">
              {MEDICAMENTOS_ALBERGUES.map((n,i) => <span className="need" key={i}>{n}</span>)}
            </div>
          </div>
        </div>
      ) : null}

      <a href="guia-ninos.html" className="guia-promo" id="guia-ninos">
        <div className="gp-ico">🧸</div>
        <div className="gp-body">
          <div className="gp-tag">Guía gratuita para familias</div>
          <div className="gp-title">¿Tus hijos siguen nerviosos o con comportamientos difíciles?</div>
          <div className="gp-sub">Herramientas suaves y frases concretas para acompañar a niñas y niños después del terremoto: hablar sin presionar, volver al cuerpo y recuperar seguridad.</div>
        </div>
        <div className="gp-cta">Abrir guía →</div>
      </a>

      {DIRECTORIO_AYUDA.length ? (
        <div className="albergues directorio" id="directorio">
          <button type="button" className="al-toggle" onClick={() => setShowDirectorio(v => !v)} aria-expanded={showDirectorio}>
            <h2>🧭 Directorio de ayuda · Damnificados</h2>
            <span className={"al-chevron" + (showDirectorio ? " open" : "")}>▾</span>
          </button>
          {showDirectorio ? (() => {
            const dirFlat = DIRECTORIO_AYUDA.flatMap(g => g.items.map(it => ({ ...it, cat: g.cat })));
            const dirFiltrados = dirFiltro === "Todos" ? dirFlat : dirFlat.filter(x => x.cat === dirFiltro);
            const catNota = dirFiltro !== "Todos"
              ? (DIRECTORIO_AYUDA.find(g => g.cat === dirFiltro) || {}).nota
              : null;
            const mostrados = dirFiltrados.slice(0, dirVisible);
            const seleccionar = (cat) => { setDirFiltro(cat); setDirVisible(6); };
            return (
              <>
                <p className="al-sub">{DIRECTORIO_FUENTE}</p>
                <div className="dir-filtros">
                  <button type="button" className={"dir-filtro" + (dirFiltro === "Todos" ? " activo" : "")} onClick={() => seleccionar("Todos")}>Todos</button>
                  {DIRECTORIO_AYUDA.map((g,gi) => (
                    <button type="button" key={gi} className={"dir-filtro" + (dirFiltro === g.cat ? " activo" : "")} onClick={() => seleccionar(g.cat)}>{g.cat}</button>
                  ))}
                </div>
                {catNota ? <p className="dir-cat-nota">{catNota}</p> : null}
                <div className="dir-items">
                  {mostrados.map((it,i) => (
                    <div className="dir-item" key={i}>
                      <div className="dir-item-head">
                        <span className="dir-nombre">{it.nombre}</span>
                        {it.wa
                          ? <a className="dir-contacto" href={"https://wa.me/" + it.wa} target="_blank" rel="noopener noreferrer">{it.contacto}</a>
                          : <span className="dir-contacto texto">{it.contacto}</span>}
                      </div>
                      {dirFiltro === "Todos" ? <span className="dir-cat-chip">{it.cat}</span> : null}
                      <div className="dir-serv">{it.servicio}</div>
                      {it.zona ? <div className="dir-zona">📍 {it.zona}</div> : null}
                      {it.obs ? <div className="dir-obs">{it.obs}</div> : null}
                    </div>
                  ))}
                </div>
                <div className="dir-foot">
                  <span className="dir-count">Mostrando {mostrados.length} de {dirFiltrados.length}</span>
                  {dirVisible < dirFiltrados.length
                    ? <button type="button" className="dir-vermas" onClick={() => setDirVisible(v => v + 6)}>Ver más ▾</button>
                    : (dirFiltrados.length > 6
                        ? <button type="button" className="dir-vermas" onClick={() => setDirVisible(6)}>Ver menos ▴</button>
                        : null)}
                </div>
              </>
            );
          })() : null}
        </div>
      ) : null}

      {ALBERGUES.length ? (
        <div className="albergues" id="albergues">
          <button
            type="button"
            className="al-toggle"
            onClick={() => setShowAlbergues(v => !v)}
            aria-expanded={showAlbergues}
          >
            <h2>Albergues temporales sin costo</h2>
            <span className={"al-chevron" + (showAlbergues ? " open" : "")}>▾</span>
          </button>
          {showAlbergues ? (
            <>
              <p className="al-sub">Si en Cali te quedaste sin dónde pasar la noche de forma segura porque tu casa o apartamento quedó inhabitable, estos albergues son gratuitos para ti y tu familia.</p>
              <div className="al-list">
                {ALBERGUES.map((a,i) => (
                  <div className="al-item" key={i}>
                    <div className="al-nombre">{a.nombre}{a.cupos ? <span className="al-cupos">{a.cupos} cupos</span> : null}</div>
                    {a.direccion ? <div className="al-dir">{a.direccion}</div> : null}
                  </div>
                ))}
              </div>
              <div className="al-contacto">{ALBERGUES_CONTACTO}</div>
              <div className="al-nota">Si quieres ayudar con almuerzos, comunícate antes con los albergues gratuitos para coordinar la entrega y evitar que se pierdan.</div>
            </>
          ) : null}
        </div>
      ) : null}

      {APOYO_PSICO_GRUPOS.length ? (
        <div className="albergues" id="psicologia">
          <button type="button" className="al-toggle" onClick={() => setShowPsico(v => !v)} aria-expanded={showPsico}>
            <h2>Apoyo psicológico gratuito</h2>
            <span className={"al-chevron" + (showPsico ? " open" : "")}>▾</span>
          </button>
          {showPsico ? (
            <>
              <p className="al-sub">{APOYO_PSICO_INFO}</p>
              {APOYO_PSICO_GRUPOS.map((g,gi) => (
                <div className="psico-grupo" key={gi}>
                  <div className="psico-grupo-tit">{g.titulo}</div>
                  {g.info ? <p className="psico-grupo-info">{g.info}</p> : null}
                  {g.form ? (
                    <div className="al-nota">
                      Diligencia este formulario y un profesional de la red se pondrá en contacto contigo:{" "}
                      <a className="dir" href={APOYO_PSICO_FORM} target="_blank" rel="noopener noreferrer">Solicitar apoyo psicológico (formulario)</a>
                    </div>
                  ) : null}
                  {g.profesionales.length ? (
                    <table className="tabla">
                      <thead>
                        <tr>
                          <th style={{width:"55%"}}>Profesional</th>
                          <th>WhatsApp</th>
                        </tr>
                      </thead>
                      <tbody>
                        {g.profesionales.map((p,i) => (
                          <tr key={i}>
                            <td data-label="Profesional"><span className="lugar">{p.nombre}</span></td>
                            <td data-label="WhatsApp">
                              <a className="dir" href={"https://wa.me/" + p.wa} target="_blank" rel="noopener noreferrer">{p.contacto}</a>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  ) : null}
                </div>
              ))}
            </>
          ) : null}
        </div>
      ) : null}

      {ASESORIA_JURIDICA.length ? (
        <div className="albergues" id="juridica">
          <button type="button" className="al-toggle" onClick={() => setShowJuridica(v => !v)} aria-expanded={showJuridica}>
            <h2>Asesoría jurídica gratuita</h2>
            <span className={"al-chevron" + (showJuridica ? " open" : "")}>▾</span>
          </button>
          {showJuridica ? (
            <>
              <p className="al-sub">{JURIDICA_INFO}</p>
              <table className="tabla">
                <thead>
                  <tr>
                    <th style={{width:"30%"}}>Profesional</th>
                    <th>En qué te puede ayudar</th>
                    <th style={{width:"20%"}}>WhatsApp</th>
                  </tr>
                </thead>
                <tbody>
                  {ASESORIA_JURIDICA.map((p,i) => (
                    <tr key={i}>
                      <td data-label="Profesional"><span className="lugar">{p.nombre}</span></td>
                      <td data-label="En qué te puede ayudar"><span className="dir">{p.area}</span></td>
                      <td data-label="WhatsApp">
                        <a className="dir" href={"https://wa.me/" + p.wa} target="_blank" rel="noopener noreferrer">{p.contacto}</a>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </>
          ) : null}
        </div>
      ) : null}

      {CIERRES_VIALES.length ? (
        <div className="albergues" id="cierres">
          <button type="button" className="al-toggle" onClick={() => setShowCierres(v => !v)} aria-expanded={showCierres}>
            <h2>Vías cerradas en Cali ({CIERRES_VIALES.length})</h2>
            <span className={"al-chevron" + (showCierres ? " open" : "")}>▾</span>
          </button>
          {showCierres ? (
            <>
              <p className="al-sub">Cierres viales activos por la emergencia. Evita estas zonas y planea rutas alternas. {CIERRES_FUENTE}</p>
              <div className="needs">
                {CIERRES_VIALES.map((c,i) => <span className="need" key={i}>{c}</span>)}
              </div>
            </>
          ) : null}
        </div>
      ) : null}

      {false ? (
        <div className="ayudas">
          <h2>Ayuda disponible — pendiente por asignar</h2>
          <p className="ay-sub">Recursos ofrecidos que aún buscan destino o coordinación. Notifica en el grupo si tu punto los necesita.</p>
          <div className="ay-list">
            {AYUDAS.map((a,i) => (
              <div className="ay-item" key={i}>
                <div className="ay-top">
                  <span className="ay-rec">{a.recurso}</span>
                  <span className="ay-dest">{a.destino}</span>
                </div>
                {(a.coordinador || a.contacto)
                  ? <div className="ay-coord">{a.coordinador}{a.contacto ? " · " + a.contacto : ""}</div> : null}
                {a.obs ? <div className="ay-obs">{a.obs}</div> : null}
              </div>
            ))}
          </div>
        </div>
      ) : null}

      <form
        id="reportar"
        className="form-card"
        name="actualizaciones"
        method="POST"
        data-netlify="true"
        data-netlify-recaptcha="true"
        netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="actualizaciones" />
        <input type="hidden" name="fecha_hora" value={nowISO} />
        <p className="hp">
          <label>No llenar: <input name="bot-field" /></label>
        </p>
        <div className="eyebrow">Reporta desde el terreno</div>
        <h2>Deja aquí tu actualización</h2>
        <p className="form-sub">
          Si estás en uno de los puntos críticos, escribe tu actualización de necesidades de donación.
        </p>
        <div className="form-grid">
          <div className="field full">
            <label htmlFor="f-act">Tu actualización de necesidades</label>
            <textarea id="f-act" name="actualizacion" required
              placeholder="Ej: Se necesitan cascos, guantes y agua. Ya hay suficientes manos."></textarea>
          </div>
          <div className="field">
            <label htmlFor="f-pt">Nombre del punto crítico</label>
            <input id="f-pt" type="text" name="punto" required placeholder="Ej: Edificio de Colores" />
          </div>
          <div className="field">
            <label htmlFor="f-dir">Dirección</label>
            <input id="f-dir" type="text" name="direccion" placeholder="Ej: Calle 5D #38A-35" />
          </div>
          <div className="field">
            <label htmlFor="f-per">Persona de referencia</label>
            <input id="f-per" type="text" name="persona" placeholder="Nombre y contacto (opcional)" />
          </div>
          <div className="field full" data-netlify-recaptcha="true"></div>
          <button className="btn-enviar" type="submit">Enviar actualización</button>
        </div>
      </form>

      <form
        id="refugio"
        className="form-card"
        name="refugios"
        method="POST"
        data-netlify="true"
        data-netlify-recaptcha="true"
        netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="refugios" />
        <input type="hidden" name="fecha_hora" value={nowISO} />
        <p className="hp">
          <label>No llenar: <input name="bot-field" /></label>
        </p>
        <div className="eyebrow">Ofrece tu casa</div>
        <h2>Ofrece tu casa como refugio temporal</h2>
        <p className="form-sub">
          Si tienes espacio seguro en tu casa o apartamento y quieres recibir temporalmente a personas que se quedaron sin dónde dormir, cuéntanos aquí. Vamos a verificar y coordinar contigo antes de enviar a alguien.
        </p>
        <div className="form-grid">
          <div className="field">
            <label htmlFor="r-nom">Nombre completo</label>
            <input id="r-nom" type="text" name="nombre" required placeholder="Tu nombre" />
          </div>
          <div className="field">
            <label htmlFor="r-tel">Teléfono / WhatsApp</label>
            <input id="r-tel" type="tel" name="telefono" required placeholder="Ej: 300 123 4567" />
          </div>
          <div className="field">
            <label htmlFor="r-zona">Barrio o zona</label>
            <input id="r-zona" type="text" name="zona" required placeholder="Ej: Barrio San Fernando, Cali" />
          </div>
          <div className="field">
            <label htmlFor="r-cupos">¿Cuántas personas puedes recibir?</label>
            <input id="r-cupos" type="number" min="1" name="cupos" required placeholder="Ej: 2" />
          </div>
          <div className="field">
            <label htmlFor="r-dias">¿Por cuánto tiempo?</label>
            <input id="r-dias" type="text" name="dias_disponible" placeholder="Ej: Unos días, una semana, indefinido" />
          </div>
          <div className="field full">
            <label htmlFor="r-cond">Condiciones o notas (opcional)</label>
            <textarea id="r-cond" name="condiciones"
              placeholder="Ej: Recibo mascotas, tengo espacio para una familia, sin costo, etc."></textarea>
          </div>
          <div className="field full" data-netlify-recaptcha="true"></div>
          <button className="btn-enviar" type="submit">Ofrecer mi casa</button>
        </div>
      </form>

      <footer>
        Directorio comunitario de donaciones. Verifica cada punto antes de desplazarte.
        <div className="footer-credit">Hecho con ❤️ por <a href="https://samuelgonzalez.org" target="_blank" rel="noopener noreferrer">SamuelGonzalez.org</a></div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
