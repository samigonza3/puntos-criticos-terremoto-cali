<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Puntos de donación</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root{
    --space-950:#040817;
    --space-900:#070D22;
    --space-800:#0B1533;
    --space-700:#122048;
    --nebula:#1B2E66;
    --star-blue:#3E7BFF;
    --star-light:#7FA8FF;
    --ice:#C9D9FF;
    --white:#F4F7FF;
    --muted:#8B9BC7;
    --alert:#FF5C6B;
    --alert-soft:rgba(255,92,107,.12);
    --ok:#3EE08E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Montserrat',system-ui,sans-serif;
    background:var(--space-950);
    color:var(--white);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 80px}

  /* Header */
  header{
    position:relative;
    padding:38px 30px 34px;
    border-radius:22px;
    background:
      radial-gradient(120% 140% at 50% -20%, var(--nebula) 0%, rgba(27,46,102,0) 55%),
      linear-gradient(180deg, var(--space-800) 0%, var(--space-900) 100%);
    border:1px solid rgba(127,168,255,.14);
    overflow:hidden;
  }
  .eyebrow{
    font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--star-light);
  }
  h1{
    font-size:clamp(28px,4vw,42px);font-weight:800;line-height:1.08;
    margin:12px 0 10px;letter-spacing:-.01em;
  }
  h1 span{color:var(--star-blue);text-shadow:0 0 26px rgba(62,123,255,.55)}
  .sub{color:var(--ice);max-width:640px;font-weight:400;font-size:15px;line-height:1.55}
  .meta{
    display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:rgba(18,32,72,.7);border:1px solid rgba(127,168,255,.16);color:var(--ice);
  }
  .chip .dot{width:7px;height:7px;border-radius:999px;background:var(--star-blue)}
  .chip.urgente .dot{background:var(--alert)}

  /* Bloques informativos */
  .grid-info{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:20px}
  .card{
    background:var(--space-800);
    border:1px solid rgba(127,168,255,.14);
    border-radius:18px;padding:22px 24px;
  }
  .card h2{
    font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--star-light);margin-bottom:14px;
  }
  .needs{display:flex;flex-wrap:wrap;gap:8px}
  .need{
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;
    background:var(--space-700);border:1px solid rgba(127,168,255,.12);color:var(--white);
  }
  .alert-card{
    background:var(--alert-soft);
    border:1px solid rgba(255,92,107,.4);
    display:flex;flex-direction:column;justify-content:center;
  }
  .alert-card .tag{
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--alert);margin-bottom:8px;
  }
  .alert-card p{font-size:16px;font-weight:700;line-height:1.35;color:var(--white)}

  /* Banner sobreabastecidos */
  .overstock{
    margin-top:16px;padding:20px 24px;border-radius:18px;
    background:rgba(255,176,32,.10);border:1px solid rgba(255,176,32,.42);
  }
  .overstock .tag{
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:#FFB020;margin-bottom:12px;display:flex;align-items:center;gap:8px;
  }
  .overstock .needs{margin-bottom:12px}
  .overstock .need{
    background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.35);color:#FFE1A8;
  }
  .overstock .desc{font-size:13.5px;line-height:1.55;color:var(--ice)}

  /* Nota de entrega dentro del punto */
  .nota{
    display:block;margin-top:8px;font-size:12.5px;line-height:1.4;
    color:var(--star-light);font-weight:500;
  }

  /* Controles */
  .controls{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    margin:32px 0 16px;
  }
  .search{
    flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
    background:var(--space-800);border:1px solid rgba(127,168,255,.16);
    border-radius:999px;padding:12px 18px;
  }
  .search:focus-within{border-color:var(--star-blue);box-shadow:0 0 0 3px rgba(62,123,255,.18)}
  .search svg{flex:none;opacity:.7}
  .search input{
    flex:1;background:none;border:none;outline:none;color:var(--white);
    font-family:inherit;font-size:15px;
  }
  .search input::placeholder{color:var(--muted)}
  .toggle{
    display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
    padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;
    background:var(--space-800);border:1px solid rgba(127,168,255,.16);color:var(--ice);
    transition:.15s;
  }
  .toggle.on{
    background:linear-gradient(180deg,var(--star-blue),#2E5FE0);
    border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(62,123,255,.28);
  }
  .toggle .box{width:16px;height:16px;border-radius:5px;border:2px solid currentColor;position:relative}
  .toggle.on .box::after{content:"";position:absolute;inset:2px;border-radius:2px;background:#fff}

  .counter{font-size:13px;color:var(--muted);margin-left:auto;font-weight:500}

  /* Tabla */
  .tabla{
    width:100%;border-collapse:separate;border-spacing:0;
    background:var(--space-900);border:1px solid rgba(127,168,255,.12);
    border-radius:18px;overflow:hidden;
  }
  .tabla thead th{
    text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--star-light);padding:16px 20px;background:var(--space-800);
    border-bottom:1px solid rgba(127,168,255,.14);
  }
  .tabla tbody td{
    padding:16px 20px;border-bottom:1px solid rgba(127,168,255,.07);
    vertical-align:top;font-size:14.5px;
  }
  .tabla tbody tr:last-child td{border-bottom:none}
  .tabla tbody tr.prio{background:linear-gradient(90deg,rgba(62,123,255,.09),transparent 60%)}
  .lugar{font-weight:700;color:var(--white);display:flex;align-items:center;gap:9px}
  .badge{
    font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;flex:none;
    background:var(--alert);color:#fff;
  }
  .dir{color:var(--ice);font-weight:500}
  .dir.vacio{color:var(--muted);font-style:italic;font-weight:400}
  .cel-need{display:flex;flex-wrap:wrap;gap:6px}
  .cel-need .need{font-size:12px;padding:5px 10px}
  .sinnead{color:var(--muted);font-size:13px}
  .empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:15px}

  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
  footer strong{color:var(--ice);font-weight:600}

  @media (max-width:820px){
    .grid-info{grid-template-columns:1fr}
  }
  @media (max-width:680px){
    .wrap{padding:24px 14px 60px}
    header{padding:28px 20px}
    .counter{width:100%;margin:0;order:5}
    .tabla thead{display:none}
    .tabla,.tabla tbody,.tabla tr,.tabla td{display:block;width:100%}
    .tabla{border-radius:16px}
    .tabla tbody tr{
      border-bottom:1px solid rgba(127,168,255,.12);padding:6px 0;
    }
    .tabla tbody tr:last-child{border-bottom:none}
    .tabla tbody td{border:none;padding:6px 18px}
    .tabla tbody td::before{
      content:attr(data-label);display:block;
      font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
      color:var(--star-light);margin-bottom:4px;
    }
    .tabla tbody td[data-label="Punto"]{padding-top:16px}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
/* ============================================================
   EDITA AQUI PARA ACTUALIZAR LA INFORMACION
   ------------------------------------------------------------
   1. ACTUALIZADO      -> fecha que se muestra en el encabezado.
   2. NECESIDADES_GENERALES -> insumos base que se necesitan en los puntos.
   3. ALERTA           -> mensaje rojo destacado (deja "" para ocultarlo).
   4. SOBREABASTECIDOS -> sectores a donde NO llevar mas ayuda (banner amarillo).
        NOTA_SOBREABASTECIDOS -> texto explicativo de ese banner.
   5. PUNTOS           -> agrega, edita o borra objetos.
        lugar        : nombre o direccion del punto
        direccion    : direccion exacta (deja "" si no aplica)
        prioridad    : true = punto urgente (resaltado + etiqueta)
        necesidades  : lista de insumos de ESE punto (deja [] si no hay)
        nota         : (opcional) instruccion de entrega. Bórrala si no aplica.
   Guarda el archivo y vuelve a arrastrarlo a Netlify.
   ============================================================ */

const ACTUALIZADO = "11 de agosto de 2026, 3:00 p. m.";

const NECESIDADES_GENERALES = [
  "Alimentos para la olla","Café","Agua","Suero","Cuerdas",
  "Porras de mango largo","Porras de mango corto","Linternas","Baldes","Gafas"
];

const ALERTA = "No descuidemos los hospitales y clínicas";

// Sectores YA sobreabastecidos: no llevar más ayuda ni personas por ahora.
const SOBREABASTECIDOS = ["Caldas","Pampalinda","Refugio","Limonar"];
const NOTA_SOBREABASTECIDOS = "Estos sectores están sobreabastecidos y con muchos civiles que dificultan la labor de los profesionales. Por favor no difundir información falsa sobre estos puntos.";

const PUNTOS = [
  { lugar:"Edificio Vanessa",   direccion:"Cra. 44 #9-35",        prioridad:true,  necesidades:[] },
  { lugar:"Edificio Elvira",    direccion:"Carrera 4 # 58-18",    prioridad:true,  necesidades:[] },
  { lugar:"Notaría 20",         direccion:"Carrera 28D # 72W-14", prioridad:true,  necesidades:["Hielo","Cascos","Tapabocas","Guantes","Personas"] },
  { lugar:"Edificio de Colores",direccion:"Calle 5D #38A-35",     prioridad:true,  necesidades:[] },
  { lugar:"Plaza de toros",     direccion:"Carrera 56 con 3A",    prioridad:true,  necesidades:["Baldes","Carretillas","Cascos de construcción"], nota:"Entregar al lado de la volqueta (Cr 56 entre 5ta y 3cera)." },
  { lugar:"Plaza de toros",     direccion:"Calle 5 #56-16",       prioridad:true,  necesidades:[] },
  { lugar:"Capri",              direccion:"Calle 10bis # 70-34",  prioridad:true,  necesidades:[] },

  { lugar:"Carrera 58 # 3-138", direccion:"Carrera 58 # 3-138",  prioridad:false, necesidades:[] },
  { lugar:"Sector la luna",     direccion:"Calle 13 con Autopista", prioridad:false, necesidades:[] },
  { lugar:"Calle 42 con 38",    direccion:"Calle 42 con 38",     prioridad:false, necesidades:[] },
  { lugar:"Calle 3 D con 67",   direccion:"Calle 3 D con 67",    prioridad:false, necesidades:[] },
  { lugar:"Calle 10 con 71",    direccion:"Calle 10 con 71",     prioridad:false, necesidades:[] },
  { lugar:"Carrera 41 con 7",   direccion:"Carrera 41 con 7",    prioridad:false, necesidades:[] },
  { lugar:"Motel Molino Rojo",  direccion:"",                    prioridad:false, necesidades:[] },
  { lugar:"Calle 9 con 24",     direccion:"Calle 9 con 24",      prioridad:false, necesidades:[] },
  { lugar:"Edificio Marisol",   direccion:"",                    prioridad:false, necesidades:[] },
  { lugar:"Carrera 9 con 53",   direccion:"Carrera 9 con 53",    prioridad:false, necesidades:[] },
  { lugar:"Calle 5 con 44",     direccion:"Calle 5 con 44",      prioridad:false, necesidades:[] },
  { lugar:"Calle 5 con 57",     direccion:"Calle 5 con 57",      prioridad:false, necesidades:[] },
  { lugar:"Calle 4 # 66b-52",   direccion:"Calle 4 # 66b-52",    prioridad:false, necesidades:[] }
];

/* ============================================================
   De aquí para abajo no necesitas tocar nada.
   ============================================================ */

const { useState, useMemo } = React;

function App(){
  const [q, setQ] = useState("");
  const [soloPrio, setSoloPrio] = useState(false);

  const filtrados = useMemo(() => {
    const t = q.trim().toLowerCase();
    return PUNTOS.filter(p => {
      if (soloPrio && !p.prioridad) return false;
      if (!t) return true;
      const blob = (p.lugar + " " + p.direccion + " " + p.necesidades.join(" ")).toLowerCase();
      return blob.includes(t);
    });
  }, [q, soloPrio]);

  const totalPrio = PUNTOS.filter(p => p.prioridad).length;

  return (
    <div className="wrap">
      <header>
        <div className="eyebrow">Coordinación de donaciones</div>
        <h1>Puntos de <span>edificios afectados</span></h1>
        <p className="sub">
          Directorio de los puntos reportados y los insumos que se necesitan en cada uno.
          Comparte esta página con quien quiera aportar. Se actualiza en un solo archivo.
        </p>
        <div className="meta">
          <span className="chip"><span className="dot"></span>{PUNTOS.length} puntos en total</span>
          <span className="chip urgente"><span className="dot"></span>{totalPrio} prioritarios</span>
          <span className="chip">Actualizado: {ACTUALIZADO}</span>
        </div>

        <div className="grid-info">
          <div className="card">
            <h2>Insumos que se necesitan</h2>
            <div className="needs">
              {NECESIDADES_GENERALES.map((n,i) => <span className="need" key={i}>{n}</span>)}
            </div>
          </div>
          {ALERTA ? (
            <div className="card alert-card">
              <div className="tag">Importante</div>
              <p>{ALERTA}</p>
            </div>
          ) : null}
        </div>
      </header>

      {SOBREABASTECIDOS.length ? (
        <div className="overstock">
          <div className="tag">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFB020" strokeWidth="2.2">
              <path d="M12 9v4M12 17h.01"></path>
              <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
            </svg>
            Sectores sobreabastecidos, no llevar más ayuda
          </div>
          <div className="needs">
            {SOBREABASTECIDOS.map((s,i) => <span className="need" key={i}>{s}</span>)}
          </div>
          <p className="desc">{NOTA_SOBREABASTECIDOS}</p>
        </div>
      ) : null}

      <div className="controls">
        <label className="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FA8FF" strokeWidth="2">
            <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>
          </svg>
          <input
            value={q}
            onChange={e => setQ(e.target.value)}
            placeholder="Buscar punto, dirección o insumo"
            aria-label="Buscar"
          />
        </label>
        <div
          className={"toggle" + (soloPrio ? " on" : "")}
          role="button" tabIndex="0"
          onClick={() => setSoloPrio(v => !v)}
          onKeyDown={e => (e.key === "Enter" || e.key === " ") && setSoloPrio(v => !v)}
        >
          <span className="box"></span> Solo prioritarios
        </div>
        <span className="counter">{filtrados.length} resultado{filtrados.length === 1 ? "" : "s"}</span>
      </div>

      <table className="tabla">
        <thead>
          <tr>
            <th style={{width:"28%"}}>Punto</th>
            <th style={{width:"27%"}}>Dirección</th>
            <th>Necesidades</th>
          </tr>
        </thead>
        <tbody>
          {filtrados.length === 0 ? (
            <tr><td colSpan="3" className="empty">No hay puntos que coincidan con la búsqueda.</td></tr>
          ) : filtrados.map((p,i) => (
            <tr key={i} className={p.prioridad ? "prio" : ""}>
              <td data-label="Punto">
                <span className="lugar">
                  {p.lugar}
                  {p.prioridad ? <span className="badge">Urgente</span> : null}
                </span>
              </td>
              <td data-label="Dirección">
                {p.direccion
                  ? <span className="dir">{p.direccion}</span>
                  : <span className="dir vacio">Por confirmar</span>}
              </td>
              <td data-label="Necesidades">
                {p.necesidades.length
                  ? <div className="cel-need">{p.necesidades.map((n,j) => <span className="need" key={j}>{n}</span>)}</div>
                  : <span className="sinnead">Ver insumos generales</span>}
                {p.nota ? <span className="nota">{p.nota}</span> : null}
              </td>
            </tr>
          ))}
        </tbody>
      </table>

      <footer>
        <strong>Cómo actualizar:</strong> abre <strong>index.html</strong>, edita el bloque <strong>PUNTOS</strong> al inicio del código y vuelve a arrastrar el archivo a Netlify.<br/>
        Directorio comunitario de donaciones. Verifica cada punto antes de desplazarte.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
