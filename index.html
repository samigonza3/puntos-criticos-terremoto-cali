<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root{
    --space-950:#040817;
    --space-900:#070D22;
    --space-800:#0B1533;
    --space-700:#122048;
    --nebula:#1B2E66;
    --star-blue:#3E7BFF;
    --star-light:#7FA8FF;
    --ice:#C9D9FF;
    --white:#F4F7FF;
    --muted:#8B9BC7;
    --alert:#FF5C6B;
    --alert-soft:rgba(255,92,107,.12);
    --ok:#3EE08E;
    --warn:#FFB020;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Montserrat',system-ui,sans-serif;
    background:var(--space-950);
    color:var(--white);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 80px}

  /* Menú hamburguesa */
  .burger-btn{
    position:fixed;top:18px;right:18px;z-index:60;
    width:44px;height:44px;border-radius:12px;border:1px solid rgba(127,168,255,.3);
    background:var(--space-800);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;cursor:pointer;
  }
  .burger-btn span{width:20px;height:2px;background:var(--ice);border-radius:2px}
  .menu-overlay{
    position:fixed;inset:0;background:rgba(4,8,23,.6);z-index:70;
  }
  .menu-panel{
    position:fixed;top:0;right:0;height:100%;width:min(78vw,300px);z-index:80;
    background:var(--space-800);border-left:1px solid rgba(127,168,255,.2);
    padding:20px 18px;display:flex;flex-direction:column;gap:6px;
    box-shadow:-12px 0 40px rgba(0,0,0,.4);
  }
  .menu-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .menu-title{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--star-light)}
  .menu-close{background:none;border:none;color:var(--ice);font-size:18px;cursor:pointer;padding:4px}
  .menu-panel a{
    display:block;padding:12px 10px;border-radius:10px;color:var(--white);
    text-decoration:none;font-size:14.5px;font-weight:600;
  }
  .menu-panel a:hover{background:rgba(127,168,255,.1)}
  .menu-link-highlight{color:#22B27A !important;font-weight:800}

  /* Header */
  header{
    position:relative;
    padding:38px 30px 34px;
    border-radius:22px;
    background:
      radial-gradient(120% 140% at 50% -20%, var(--nebula) 0%, rgba(27,46,102,0) 55%),
      linear-gradient(180deg, var(--space-800) 0%, var(--space-900) 100%);
    border:1px solid rgba(127,168,255,.14);
    overflow:hidden;
  }
  .eyebrow{
    font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--star-light);
  }
  h1{
    font-size:clamp(28px,4vw,42px);font-weight:800;line-height:1.08;
    margin:12px 0 10px;letter-spacing:-.01em;
  }
  h1 span{color:var(--star-blue);text-shadow:0 0 26px rgba(62,123,255,.55)}
  .sub{color:var(--ice);max-width:640px;font-weight:400;font-size:15px;line-height:1.55}
  .meta{
    display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:rgba(18,32,72,.7);border:1px solid rgba(127,168,255,.16);color:var(--ice);
  }
  .chip .dot{width:7px;height:7px;border-radius:999px;background:var(--star-blue)}
  .chip.urgente .dot{background:var(--alert)}

  /* Última actualización en grande */
  .lastupdate{
    display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;
    margin-bottom:20px;padding:26px 22px;border-radius:22px;
    background:linear-gradient(180deg, rgba(62,123,255,.20), rgba(62,123,255,.05));
    border:1px solid rgba(127,168,255,.4);
    box-shadow:0 10px 34px rgba(62,123,255,.16);
  }
  .lastupdate .lu-label{
    display:inline-flex;align-items:center;gap:9px;
    font-size:12.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--star-light);
  }
  .lastupdate .lu-label .live{
    width:9px;height:9px;border-radius:999px;background:var(--ok);
    box-shadow:0 0 0 0 rgba(62,224,142,.6);animation:pulse 2s infinite;
  }
  .lastupdate .lu-time{font-size:clamp(26px,6vw,44px);font-weight:900;color:var(--white);line-height:1.02;letter-spacing:-.01em}

  /* Bloques informativos */
  .grid-info{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:20px}
  .card{
    background:var(--space-800);
    border:1px solid rgba(127,168,255,.14);
    border-radius:18px;padding:22px 24px;
  }
  .card h2{
    font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--star-light);margin-bottom:14px;
  }
  .needs{display:flex;flex-wrap:wrap;gap:8px}
  .need{
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;
    background:var(--space-700);border:1px solid rgba(127,168,255,.12);color:var(--white);
  }
  .alert-card{
    background:var(--alert-soft);
    border:1px solid rgba(255,92,107,.4);
    display:flex;flex-direction:column;justify-content:center;
  }
  .alert-card .tag{
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--alert);margin-bottom:8px;
  }
  .alert-card p{font-size:16px;font-weight:700;line-height:1.35;color:var(--white)}

  /* Banner sectores sobreabastecidos */
  .overstock{
    margin-top:20px;padding:22px 24px;border-radius:20px;
    background:rgba(255,176,32,.10);border:1px solid rgba(255,176,32,.42);
  }
  .overstock .tag{
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--warn);margin-bottom:14px;display:flex;align-items:center;gap:9px;line-height:1.3;
  }
  .overstock .tag svg{flex:none}
  .overstock .needs{margin-bottom:12px}
  .overstock .need{
    background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.35);color:#FFE1A8;font-weight:600;
  }
  .overstock .desc{font-size:13.5px;line-height:1.55;color:var(--ice)}

  /* Sección de contraste: no salir sin verificar */
  .contrast{
    margin-bottom:20px;padding:26px 26px;border-radius:22px;text-align:center;
    background:linear-gradient(180deg, rgba(62,224,142,.14), rgba(62,224,142,.04));
    border:1px solid rgba(62,224,142,.45);
  }
  .contrast h2{
    font-size:clamp(18px,3vw,24px);font-weight:900;line-height:1.15;color:var(--white);
    margin-bottom:12px;letter-spacing:-.01em;
  }
  .contrast h2 span{color:var(--ok)}
  .contrast p{font-size:14.5px;line-height:1.6;color:var(--ice);max-width:640px;margin:0 auto 10px}
  .contrast p:last-child{margin-bottom:0}
  .contrast p strong{color:var(--white);font-weight:800}
  .contrast .contrast-cierre{margin-top:12px;font-size:15px;font-weight:800;color:var(--ok)}

  /* Marco de alta prioridad */
  .priority{
    margin-top:20px;padding:22px 24px;border-radius:20px;
    background:linear-gradient(180deg, rgba(255,92,107,.16), rgba(255,92,107,.07));
    border:1px solid rgba(255,92,107,.55);
    box-shadow:0 0 0 1px rgba(255,92,107,.15), 0 10px 30px rgba(255,92,107,.12);
  }
  .priority .tag{
    font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--alert);margin-bottom:14px;display:flex;align-items:center;gap:9px;
  }
  .priority .tag svg{flex:none}
  .priority .pr-item{
    display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,92,107,.16);
  }
  .priority .pr-item:last-child{border-bottom:none;padding-bottom:0}
  .priority .pr-item:first-of-type{padding-top:0}
  .priority .pr-dot{flex:none;width:9px;height:9px;border-radius:999px;background:var(--alert);margin-top:6px}
  .priority .pr-name{font-size:15.5px;font-weight:800;color:var(--white);margin-bottom:2px}
  .priority .pr-nota{font-size:13.5px;line-height:1.5;color:var(--ice)}

  /* Albergues temporales */
  .albergues{
    margin-top:20px;padding:24px 26px;border-radius:20px;
    background:var(--space-800);border:1px solid rgba(62,224,142,.32);
  }
  .albergues h2{
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ok);margin:0;
  }
  .al-toggle{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    background:none;border:none;padding:0;margin-bottom:6px;cursor:pointer;
  }
  .al-chevron{
    color:var(--ok);font-size:16px;transition:transform .15s;flex:0 0 auto;margin-left:12px;
  }
  .al-chevron.open{transform:rotate(180deg)}
  .albergues .al-sub{color:var(--ice);font-size:13.5px;line-height:1.5;margin-bottom:16px}
  .al-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .al-item{
    background:var(--space-900);border:1px solid rgba(62,224,142,.2);
    border-radius:14px;padding:14px 16px;
  }
  .al-nombre{font-size:14.5px;font-weight:700;color:var(--white)}
  .al-cupos{
    display:inline-block;margin-left:8px;font-size:11px;font-weight:800;
    letter-spacing:.04em;color:#04240F;background:var(--ok);
    padding:2px 8px;border-radius:999px;vertical-align:middle;
  }
  .al-dir{color:var(--star-light);font-size:12.5px;font-weight:500;margin-top:5px;line-height:1.4}
  .al-contacto{
    margin-top:16px;padding:14px 16px;border-radius:12px;
    background:rgba(62,224,142,.1);border:1px solid rgba(62,224,142,.28);
    color:var(--white);font-size:13.5px;font-weight:600;line-height:1.5;
  }
  .al-nota{margin-top:10px;color:var(--ice);font-size:13px;line-height:1.5}
  @media (max-width:680px){ .al-list{grid-template-columns:1fr} }

  /* Últimas actualizaciones */
  .updates{
    margin-top:20px;
    background:var(--space-800);
    border:1px solid rgba(127,168,255,.14);
    border-radius:18px;padding:22px 24px;
  }
  .updates h2{
    font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--star-light);margin-bottom:16px;display:flex;align-items:center;gap:9px;
  }
  .updates h2 .live{
    width:8px;height:8px;border-radius:999px;background:var(--ok);
    box-shadow:0 0 0 0 rgba(62,224,142,.6);animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(62,224,142,.5)}
    70%{box-shadow:0 0 0 8px rgba(62,224,142,0)}
    100%{box-shadow:0 0 0 0 rgba(62,224,142,0)}
  }
  .up-item{
    display:flex;gap:14px;padding:12px 0;
    border-bottom:1px solid rgba(127,168,255,.08);
  }
  .up-item:last-child{border-bottom:none;padding-bottom:0}
  .up-item:first-child{padding-top:0}
  .up-dot{
    flex:none;width:9px;height:9px;border-radius:999px;background:var(--star-blue);margin-top:6px;
  }
  .up-body{flex:1}
  .up-time{
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);
    text-transform:uppercase;margin-bottom:3px;
  }
  .up-text{font-size:14px;color:var(--white);line-height:1.5;font-weight:500}
  .up-punto{font-size:14px;font-weight:800;color:var(--star-light);margin-bottom:2px}
  .up-contacto{font-size:12.5px;font-weight:600;color:var(--ok);margin-top:5px}
  .up-toggle{
    margin-top:16px;width:100%;cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:700;color:var(--star-light);
    background:var(--space-900);border:1px solid rgba(127,168,255,.2);
    border-radius:12px;padding:11px 16px;transition:.15s;
  }
  .up-toggle:hover{border-color:var(--star-blue);color:var(--white)}

  /* Ayuda disponible */
  .ayudas{
    margin-top:20px;
    background:var(--space-800);
    border:1px solid rgba(62,224,142,.3);
    border-radius:20px;padding:24px 26px;
  }
  .ayudas h2{
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ok);margin-bottom:6px;
  }
  .ayudas .ay-sub{color:var(--ice);font-size:13.5px;margin-bottom:16px}
  .ay-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ay-item{
    background:var(--space-900);border:1px solid rgba(62,224,142,.2);
    border-radius:14px;padding:14px 16px;
  }
  .ay-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ay-rec{font-size:14.5px;font-weight:700;color:var(--white)}
  .ay-dest{
    font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ok);background:rgba(62,224,142,.12);padding:3px 9px;border-radius:999px;flex:none;
  }
  .ay-coord{color:var(--star-light);font-size:12.5px;font-weight:600;margin-top:7px}
  .ay-obs{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.45}
  @media (max-width:680px){
    .ay-list{grid-template-columns:1fr}
  }

  /* Botón que lleva al formulario */
  .cta-reportar{
    display:flex;align-items:center;justify-content:center;gap:11px;
    margin-top:20px;text-decoration:none;cursor:pointer;
    font-size:15.5px;font-weight:700;color:#fff;
    padding:16px 24px;border-radius:16px;
    background:linear-gradient(180deg,var(--star-blue),#2E5FE0);
    border:1px solid rgba(127,168,255,.4);
    box-shadow:0 8px 22px rgba(62,123,255,.28);transition:.15s;
  }
  .cta-reportar:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(62,123,255,.42)}
  .cta-reportar .cta-ico{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:999px;background:rgba(255,255,255,.2);
    font-size:18px;font-weight:400;line-height:1;
  }
  #reportar{scroll-margin-top:20px}
  #refugio{scroll-margin-top:20px}
  .top-actions{
    display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px;
  }
  .cta-sm{
    flex:1 1 220px;margin-top:0;padding:11px 16px;font-size:13px;border-radius:12px;
  }
  .cta-sm .cta-ico{width:19px;height:19px;font-size:14px}
  .cta-refugio{
    background:linear-gradient(180deg,#22B27A,#178A5D);
    border:1px solid rgba(120,230,190,.4);
    box-shadow:0 8px 22px rgba(34,178,122,.28);
  }
  .cta-refugio:hover{box-shadow:0 10px 28px rgba(34,178,122,.42)}
  .map-btn{background:linear-gradient(180deg,#2E5FE0,#1E3FB0)}
  .mapa-box{
    margin-top:16px;border:1px solid rgba(127,168,255,.18);
    border-radius:20px;overflow:hidden;background:var(--space-800);
  }
  .mapa{height:460px;width:100%}
  .mapa .leaflet-popup-content{font-family:'Montserrat',sans-serif;font-size:13px;line-height:1.4}
  .mapa-nota{padding:12px 18px;font-size:12px;color:var(--muted);line-height:1.5}

  /* Clínicas que requieren evacuación */
  .clinicas{
    margin-top:20px;
    background:var(--alert-soft);
    border:1px solid rgba(255,92,107,.4);
    border-radius:20px;padding:24px 26px;
  }
  .clinicas h2{
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--alert);margin-bottom:6px;display:flex;align-items:center;gap:9px;
  }
  .clinicas .cl-sub{color:var(--ice);font-size:13.5px;margin-bottom:16px}
  .cl-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cl-item{
    display:flex;align-items:center;gap:10px;
    background:var(--space-900);border:1px solid rgba(255,92,107,.25);
    border-radius:12px;padding:12px 15px;font-size:14.5px;font-weight:600;color:var(--white);
  }
  .cl-item::before{
    content:"";flex:none;width:8px;height:8px;border-radius:999px;background:var(--alert);
  }
  @media (max-width:680px){
    .cl-list{grid-template-columns:1fr}
  }

  /* Formulario de actualización */
  .form-card{
    margin-top:20px;
    background:
      radial-gradient(120% 160% at 100% 0%, rgba(62,123,255,.14) 0%, rgba(62,123,255,0) 55%),
      var(--space-800);
    border:1px solid rgba(127,168,255,.22);
    border-radius:20px;padding:26px 26px 28px;
  }
  .form-card .eyebrow{margin-bottom:6px}
  .form-card h2{
    font-size:clamp(20px,2.6vw,26px);font-weight:800;line-height:1.12;
    color:var(--white);margin:0 0 6px;letter-spacing:-.01em;text-transform:none;
  }
  .form-card .form-sub{color:var(--ice);font-size:14px;line-height:1.5;margin-bottom:20px;max-width:560px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1 / -1}
  .field label{
    font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--star-light);
  }
  .field input,.field textarea{
    width:100%;font-family:inherit;font-size:15px;color:var(--white);
    background:var(--space-900);border:1px solid rgba(127,168,255,.18);
    border-radius:12px;padding:12px 14px;outline:none;transition:.15s;
  }
  .field textarea{min-height:96px;resize:vertical;line-height:1.5}
  .field input::placeholder,.field textarea::placeholder{color:var(--muted)}
  .field input:focus,.field textarea:focus{
    border-color:var(--star-blue);box-shadow:0 0 0 3px rgba(62,123,255,.18);
  }
  .btn-enviar{
    grid-column:1 / -1;justify-self:start;margin-top:4px;
    display:inline-flex;align-items:center;gap:9px;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:700;color:#fff;
    padding:13px 26px;border:none;border-radius:999px;
    background:linear-gradient(180deg,var(--star-blue),#2E5FE0);
    box-shadow:0 8px 22px rgba(62,123,255,.28);transition:.15s;
  }
  .btn-enviar:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(62,123,255,.4)}
  .hp{position:absolute;left:-9999px}
  @media (max-width:680px){
    .form-grid{grid-template-columns:1fr}
  }

  /* Controles */
  .controls{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    margin:32px 0 16px;
  }
  .search{
    flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
    background:var(--space-800);border:1px solid rgba(127,168,255,.16);
    border-radius:999px;padding:12px 18px;
  }
  .search:focus-within{border-color:var(--star-blue);box-shadow:0 0 0 3px rgba(62,123,255,.18)}
  .search svg{flex:none;opacity:.7}
  .search input{
    flex:1;background:none;border:none;outline:none;color:var(--white);
    font-family:inherit;font-size:15px;
  }
  .search input::placeholder{color:var(--muted)}
  .toggle{

const { useState, useMemo, useRef, useEffect } = React;

function Mapa({ puntos }){
  const ref = useRef(null);
  const mapRef = useRef(null);
  const [estado, setEstado] = useState("Cargando mapa y ubicando puntos…");

  useEffect(() => {
    if (!ref.current || mapRef.current || typeof L === "undefined") return;
    const map = L.map(ref.current).setView([3.95, -76.3], 9);
    mapRef.current = map;
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap"
    }).addTo(map);
    setTimeout(() => map.invalidateSize(), 120);

    let cancel = false;
    (async () => {
      const bounds = [];
      let ok = 0;
      for (const p of puntos) {
        if (cancel) return;
        let lat, lon;
        if (p.coords) { lat = p.coords[0]; lon = p.coords[1]; }
        else {
          const q = p.mapq ? p.mapq : ((p.direccion || p.lugar) + ", Cali, Valle del Cauca, Colombia");
          try {
            const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=co&q=" + encodeURIComponent(q));
            const d = await r.json();
            if (d && d[0]) { lat = parseFloat(d[0].lat); lon = parseFloat(d[0].lon); }
          } catch (e) {}
          await new Promise(res => setTimeout(res, 1100));
        }
        if (cancel) return;
        if (lat != null && lon != null && !isNaN(lat) && !isNaN(lon)) {
          const color = p.estado === "urgente" ? "#FF5C6B" : p.cubierto ? "#3EE08E" : "#3E7BFF";
          const mk = L.circleMarker([lat, lon], {
            radius: 9, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1
          }).addTo(map);
          const needs = (p.necesidades && p.necesidades.length) ? "<br/>" + p.necesidades.join(", ") : "";
          mk.bindPopup("<b>" + p.lugar + "</b>" + (p.direccion ? "<br/>" + p.direccion : "") + needs);
          bounds.push([lat, lon]); ok++;
          setEstado(ok + " puntos ubicados…");
        }
      }
      if (!cancel) {
        if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
        setEstado(ok ? (ok + " de " + puntos.length + " puntos ubicados") : "No se pudieron ubicar los puntos automáticamente");
      }
    })();

    return () => { cancel = true; };
  }, []);

  return (
    <div className="mapa-box">
      <div ref={ref} className="mapa"></div>
      <div className="mapa-nota">{estado}. Ubicaciones aproximadas (geocodificadas automáticamente); verifica antes de desplazarte.</div>
    </div>
  );
}

        <div className="sec-head">
          <h2>Municipios que piden ayuda</h2>
          <p className="sec-sub">Dirige tu donación o transporte hacia estos municipios del norte del Valle. Llévala a un centro de acopio (más abajo) para que llegue allá.</p>
        </div>
        <div className="dest-list">
          {MUNICIPIOS.map((m,i) => (
            <div className={"dest-item" + (m.estado === "urgente" ? " urg" : "")} key={i}>
              <div className="dest-top">
                <span className="dest-nombre">{m.nombre}</span>
                {m.estado === "urgente"
                  ? <span className="badge">Urgente</span>
                  : <span className="dest-region">{m.region}</span>}
              </div>
              {m.estado === "urgente" ? <div className="dest-region">{m.region}</div> : null}
              {m.nota ? <div className="dest-nota">{m.nota}</div> : null}
              {m.necesidades.length
                ? <div className="cel-need">{m.necesidades.map((n,j) => <span className="need" key={j}>{n}</span>)}</div>
                : <div className="dest-porconf">Necesidad por confirmar</div>}
              {m.contacto ? <div className="dest-contacto">Contacto: {m.contacto}</div> : null}
            </div>
          ))}
        </div>
      </div>

      {LADERAS.length ? (
        <div className="seccion" id="laderas">
          <div className="sec-head">
            <h2>Laderas de Cali</h2>
            <p className="sec-sub">Zonas de ladera con familias afectadas que están recibiendo apoyo en el sitio.</p>
          </div>
          <div className="dest-list">
            {LADERAS.map((l,i) => (
              <div className="dest-item" key={i}>
                <div className="dest-top">
                  <span className="dest-nombre">{l.nombre}</span>
                  <span className="dest-region">Ladera de Cali</span>
                </div>
                {l.nota ? <div className="dest-nota">{l.nota}</div> : null}
                {l.necesidades.length
                  ? <div className="cel-need">{l.necesidades.map((n,j) => <span className="need" key={j}>{n}</span>)}</div>
                  : null}
              </div>
            ))}
          </div>
        </div>
      ) : null}

      <div className="seccion" id="enviar">
        <div className="sec-head">
          <h2>Cómo enviar tu ayuda</h2>
          <p className="sec-sub">Lleva tus donaciones a estos centros de acopio: desde ahí las despachan a los municipios y a las laderas. Si tienes vehículo, revisa el transporte disponible.</p>
        </div>
        <div className="acopio-list">
          {ACOPIOS.map((a,i) => (
            <div className="acopio-item" key={i}>
              <div className="acopio-nombre">{a.nombre}</div>
              {a.direccion ? <div className="acopio-dir">{a.direccion}</div> : null}
              {a.nota ? <div className="acopio-nota">{a.nota}</div> : null}
              {a.contacto ? <div className="dest-contacto">Contacto: {a.contacto}</div> : null}
            </div>
          ))}
        </div>
        {TRANSPORTE.length ? (
          <div className="transporte">
            <div className="tr-tag">🚚 Transporte disponible hacia municipios</div>
            {TRANSPORTE.map((t,i) => (
              <div className="tr-item" key={i}>
                <span>{t.recurso}</span>
                {t.contacto ? <span className="tr-contacto">Contacto: {t.contacto}</span> : null}
              </div>
            ))}
          </div>
        ) : null}
        <button className="cta-reportar map-btn" onClick={() => setShowMapa(v => !v)}>
          <span className="cta-ico">🗺</span>
          {showMapa ? "Ocultar mapa" : "Ver mapa de municipios y acopios"}
        </button>
        {showMapa ? (
          <Mapa puntos={[
            ...MUNICIPIOS.map(m => ({ lugar:m.nombre, direccion:m.region, mapq:m.nombre + ", Valle del Cauca, Colombia", estado:m.estado, necesidades:m.necesidades })),
            ...LADERAS.map(l => ({ lugar:l.nombre, direccion:"Ladera de Cali", necesidades:l.necesidades })),
            ...ACOPIOS.map(a => ({ lugar:a.nombre, direccion:a.direccion, cubierto:true, necesidades:[] })),
          ]} />
        ) : null}
      </div>

      {ALTA_PRIORIDAD.length ? (
        <div className="priority">
          <div className="tag">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF5C6B" strokeWidth="2.2">
              <path d="M12 9v4M12 17h.01"></path>
              <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
            </svg>
            Últimas actualizaciones importantes
          </div>
          {ALTA_PRIORIDAD.map((p,i) => (
            <div className="pr-item" key={i}>
              <span className="pr-dot"></span>
              <div>
                <div className="pr-name">{p.punto}</div>
                {p.nota ? <div className="pr-nota">{p.nota}</div> : null}
              </div>
            </div>
          ))}
        </div>
      ) : null}

      {ALBERGUES.length ? (
        <div className="albergues" id="albergues">
          <button
            type="button"
            className="al-toggle"
            onClick={() => setShowAlbergues(v => !v)}
            aria-expanded={showAlbergues}
          >
            <h2>Albergues temporales sin costo</h2>
            <span className={"al-chevron" + (showAlbergues ? " open" : "")}>▾</span>
          </button>
          {showAlbergues ? (
            <>
              <p className="al-sub">Si en Cali te quedaste sin dónde pasar la noche de forma segura porque tu casa o apartamento quedó inhabitable, estos albergues son gratuitos para ti y tu familia.</p>
              <div className="al-list">
                {ALBERGUES.map((a,i) => (
                  <div className="al-item" key={i}>
                    <div className="al-nombre">{a.nombre}{a.cupos ? <span className="al-cupos">{a.cupos} cupos</span> : null}</div>
                    {a.direccion ? <div className="al-dir">{a.direccion}</div> : null}
                  </div>
                ))}
              </div>
              <div className="al-contacto">{ALBERGUES_CONTACTO}</div>
              <div className="al-nota">Si quieres ayudar con almuerzos, comunícate antes con los albergues gratuitos para coordinar la entrega y evitar que se pierdan.</div>
            </>
          ) : null}
        </div>
      ) : null}

      <div className="rescate" id="rescate">
      <button type="button" className="al-toggle" onClick={() => setShowRescate(v => !v)} aria-expanded={showRescate}>
        <h2>Puntos de rescate en Cali · fase anterior</h2>
        <span className={"al-chevron" + (showRescate ? " open" : "")}>▾</span>
      </button>
      {showRescate ? (
      <>
      <p className="al-sub">Registro de los puntos de rescate de los primeros días. La mayoría ya están abastecidos o cerrados; se conservan como referencia. Confirma antes de desplazarte.</p>
      <div className="controls">
        <label className="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FA8FF" strokeWidth="2">
            <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>
          </svg>
          <input
            value={q}
            onChange={e => setQ(e.target.value)}
            placeholder="Buscar punto, dirección o contacto"
            aria-label="Buscar"
          />
        </label>
        <span className="counter">{filtrados.length} resultado{filtrados.length === 1 ? "" : "s"}</span>
      </div>

      <table className="tabla">
        <thead>
          <tr>
            <th style={{width:"38%"}}>Punto</th>
            <th style={{width:"32%"}}>Dirección</th>
            <th>Contacto</th>
          </tr>
        </thead>
        <tbody>
          {filtrados.length === 0 ? (
            <tr><td colSpan="3" className="empty">No hay puntos que coincidan con la búsqueda.</td></tr>
          ) : filtrados.map((p,i) => (
            <tr key={i}>
              <td data-label="Punto">
                <span className="lugar">{p.lugar}</span>
              </td>
              <td data-label="Dirección">
                {(p.direccion && p.direccion.trim() !== p.lugar.trim())
                  ? <span className="dir">{p.direccion}</span>
                  : <span className="dir vacio">—</span>}
              </td>
              <td data-label="Contacto">
                {(p.coordinador || p.contacto)
                  ? <span className="dir">{p.coordinador}{(p.coordinador && p.contacto) ? " · " : ""}{p.contacto}</span>
                  : <span className="dir vacio">—</span>}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      </>
      ) : null}
      </div>

      {false ? (
        <div className="ayudas">
          <h2>Ayuda disponible — pendiente por asignar</h2>
          <p className="ay-sub">Recursos ofrecidos que aún buscan destino o coordinación. Notifica en el grupo si tu punto los necesita.</p>
          <div className="ay-list">
            {AYUDAS.map((a,i) => (
              <div className="ay-item" key={i}>
                <div className="ay-top">
                  <span className="ay-rec">{a.recurso}</span>
                  <span className="ay-dest">{a.destino}</span>
                </div>
                {(a.coordinador || a.contacto)
                  ? <div className="ay-coord">{a.coordinador}{a.contacto ? " · " + a.contacto : ""}</div> : null}
                {a.obs ? <div className="ay-obs">{a.obs}</div> : null}
              </div>
            ))}
          </div>
        </div>
      ) : null}

      <form
        id="reportar"
        className="form-card"
        name="actualizaciones"
        method="POST"
        data-netlify="true"
        data-netlify-recaptcha="true"
        netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="actualizaciones" />
        <input type="hidden" name="fecha_hora" value={nowISO} />
        <p className="hp">
          <label>No llenar: <input name="bot-field" /></label>
        </p>
        <div className="eyebrow">Reporta desde el terreno</div>
        <h2>Deja aquí tu actualización</h2>
        <p className="form-sub">
          Si estás en uno de los puntos críticos, escribe tu actualización de necesidades de donación.
        </p>
        <div className="form-grid">
          <div className="field full">
            <label htmlFor="f-act">Tu actualización de necesidades</label>
            <textarea id="f-act" name="actualizacion" required
              placeholder="Ej: Se necesitan cascos, guantes y agua. Ya hay suficientes manos."></textarea>
          </div>
          <div className="field">
            <label htmlFor="f-pt">Nombre del punto crítico</label>
            <input id="f-pt" type="text" name="punto" required placeholder="Ej: Edificio de Colores" />
          </div>
          <div className="field">
            <label htmlFor="f-dir">Dirección</label>
            <input id="f-dir" type="text" name="direccion" placeholder="Ej: Calle 5D #38A-35" />
          </div>
          <div className="field">
            <label htmlFor="f-per">Persona de referencia</label>
            <input id="f-per" type="text" name="persona" placeholder="Nombre y contacto (opcional)" />
          </div>
          <div className="field full" data-netlify-recaptcha="true"></div>
          <button className="btn-enviar" type="submit">Enviar actualización</button>
        </div>
      </form>

      <form
        id="refugio"
        className="form-card"
        name="refugios"
        method="POST"
        data-netlify="true"
        data-netlify-recaptcha="true"
        netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="refugios" />
        <input type="hidden" name="fecha_hora" value={nowISO} />
        <p className="hp">
          <label>No llenar: <input name="bot-field" /></label>
        </p>
        <div className="eyebrow">Ofrece tu casa</div>
        <h2>Ofrece tu casa como refugio temporal</h2>
        <p className="form-sub">
          Si tienes espacio seguro en tu casa o apartamento y quieres recibir temporalmente a personas que se quedaron sin dónde dormir, cuéntanos aquí. Vamos a verificar y coordinar contigo antes de enviar a alguien.
        </p>
        <div className="form-grid">
          <div className="field">
            <label htmlFor="r-nom">Nombre completo</label>
            <input id="r-nom" type="text" name="nombre" required placeholder="Tu nombre" />
          </div>
          <div className="field">
            <label htmlFor="r-tel">Teléfono / WhatsApp</label>
            <input id="r-tel" type="tel" name="telefono" required placeholder="Ej: 300 123 4567" />
          </div>
          <div className="field">
            <label htmlFor="r-zona">Barrio o zona</label>
            <input id="r-zona" type="text" name="zona" required placeholder="Ej: Barrio San Fernando, Cali" />
          </div>
          <div className="field">
            <label htmlFor="r-cupos">¿Cuántas personas puedes recibir?</label>
            <input id="r-cupos" type="number" min="1" name="cupos" required placeholder="Ej: 2" />
          </div>
          <div className="field">
            <label htmlFor="r-dias">¿Por cuánto tiempo?</label>
            <input id="r-dias" type="text" name="dias_disponible" placeholder="Ej: Unos días, una semana, indefinido" />
          </div>
          <div className="field full">
            <label htmlFor="r-cond">Condiciones o notas (opcional)</label>
            <textarea id="r-cond" name="condiciones"
              placeholder="Ej: Recibo mascotas, tengo espacio para una familia, sin costo, etc."></textarea>
          </div>
          <div className="field full" data-netlify-recaptcha="true"></div>
          <button className="btn-enviar" type="submit">Ofrecer mi casa</button>
        </div>
      </form>

      <footer>
        Directorio comunitario de donaciones. Verifica cada punto antes de desplazarte.
        <div className="footer-credit">Hecho con ❤️ por <a href="https://samuelgonzalez.org" target="_blank" rel="noopener noreferrer">SamuelGonzalez.org</a></div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
