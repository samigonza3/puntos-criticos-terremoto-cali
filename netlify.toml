[build]
  publish = "."
  command = ""

# ---- Seguridad: cabeceras para todo el sitio ----
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP en modo "solo reporte": no bloquea nada, solo avisa en la consola.
    # Cuando no salgan avisos al navegar y probar formularios, cambia el nombre a Content-Security-Policy.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://formsubmit.co; frame-src https://www.googletagmanager.com; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# ---- Seguridad: archivos internos que no deben ser públicos ----
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/Claude%20outputs/*"
  to = "/404.html"
  status = 404
  force = true
